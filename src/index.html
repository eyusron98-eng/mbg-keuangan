}

// ============================================================
//  RIWAYAT — Ledger format dengan edit/delete buttons + Excel export
//  Mode: aktual (pakai riil)
// ============================================================
async function exportRiwayatExcel(rows, dapurMap, namaFile) {
  await ensureXLSX();
  // Ledger sheet
  const ledgerData = rows.map(function(r){
    return {
      'Tanggal': r.tanggal === '-' ? '-' : fmtDDMMYYYY(r.tanggal),
      'No Bukti': r.no_bukti, 'Uraian': r.uraian,
      'Debit': r.debit || 0, 'Kredit': r.kredit || 0, 'Saldo': r.saldo || 0,
      'Jenis': r.tx ? r.tx.jenis : (r.kind === 'topup' ? 'Top-up VA' : 'Saldo Awal'),
      'Kategori': r.tx ? r.tx.kategori : '',
      'Sumber': r.tx ? r.tx.sumber : '',
      'Dapur': r.tx ? (dapurMap[r.tx.dapur] || r.tx.dapur) : '',
      'Bukti URL': r.tx ? (r.tx.bukti_url || '') : '',
    };
  });
  const ws = XLSX.utils.json_to_sheet(ledgerData);
  ws['!cols'] = [
    { wch: 12 }, { wch: 12 }, { wch: 40 },
    { wch: 14 }, { wch: 14 }, { wch: 14 },
    { wch: 14 }, { wch: 24 }, { wch: 12 }, { wch: 24 }, { wch: 50 },
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Buku Besar');
  XLSX.writeFile(wb, namaFile);
}

function Riwayat({ session, scope, toast, refreshKey }) {
  const [periodeList, setPeriodeList] = useState([]);
  const [selPeriode, setSelPeriode] = useState('');
  const [transaksi, setTransaksi] = useState([]);
  const [vaTopups, setVaTopups] = useState([]);
  const [dapur, setDapur] = useState([]);
  const [kategoriMap, setKategoriMap] = useState({});
  const [loading, setLoading] = useState(true);
  const [editTrx, setEditTrx] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [q, setQ] = useState('');
  const [filterJenis, setFilterJenis] = useState('ALL');

  const canEdit = session.user.role === 'akuntan';
  const [changes, setChanges] = useState([]);
  const [hapusReq, setHapusReq] = useState(null);

  const loadPeriode = useCallback(async function() {
    const dapurId = scope && scope !== 'ALL' ? scope : (session.user.dapur || '');
    const [pl, dp, kat] = await Promise.all([
      api('getPeriodeList', { role: session.user.role, dapur: dapurId, scope: scope }),
      api('getDapur'),
      api('getKategori'),
    ]);
    if (pl.ok) {
      setPeriodeList(pl.data);
      const aktif = pl.data.find(function(p){return p.status === 'AKTIF';});
      // Pertahankan pilihan hanya bila periodenya ada di daftar dapur yang baru; kalau tidak (mis. admin ganti dapur),
      // pindah ke periode aktif dapur baru. (Sebelumnya: periode dapur lama tetap terpilih → data kosong/salah.)
      setSelPeriode(function(prev){
        if (prev && pl.data.some(function(p){ return p.id === prev; })) return prev;
        return aktif ? aktif.id : (pl.data[0] ? pl.data[0].id : '');
      });
      if (pl.data.length === 0) setLoading(false);
    } else { setLoading(false); }
    if (dp.ok) setDapur(dp.data);
    if (kat.ok) setKategoriMap(kat.data);
  }, [scope]);

  const loadData = useCallback(async function() {
    if (!selPeriode) return;
    setLoading(true);
    const selObj = periodeList.find(function(p){return p.id === selPeriode;});
    const dapurId = selObj ? selObj.dapur : (scope && scope !== 'ALL' ? scope : (session.user.dapur || ''));
    const [tx, va] = await Promise.all([
      api('getTransaksi', { role: session.user.role, dapur: session.user.dapur || '', scope: scope || 'ALL', periode_id: selPeriode }),
      api('getVATopups', { dapur: dapurId, periode_id: selPeriode }),
    ]);
    setLoading(false);
    if (tx.ok) setTransaksi(tx.data);
    if (va.ok) setVaTopups(va.data);
    if (canEdit) { const ch = await api('getTxChanges', { periode_id: selPeriode }); if (ch.ok) setChanges(ch.data); }
  }, [selPeriode, scope, refreshKey, periodeList]);

  useEffect(function() { loadPeriode(); }, [loadPeriode]);
  useEffect(function() { loadData(); }, [loadData]);

  const periode = periodeList.find(function(p){return p.id === selPeriode;});
  const dapurMap = useMemo(function(){ const m = {}; dapur.forEach(function(d){ m[d.id] = d.nama; }); return m; }, [dapur]);

  const filteredTx = useMemo(function() {
    let t = transaksi;
    if (filterJenis !== 'ALL') t = t.filter(function(x){return x.jenis === filterJenis;});
    if (q.trim()) {
      const qq = q.toLowerCase();
      t = t.filter(function(r){
        return (r.uraian||'').toLowerCase().indexOf(qq) >= 0 ||
               (r.kategori||'').toLowerCase().indexOf(qq) >= 0 ||
               (r.no_bukti||'').toLowerCase().indexOf(qq) >= 0;
      });
    }
    return t;
  }, [transaksi, q, filterJenis]);

  // Saldo berjalan selalu dihitung dari SELURUH transaksi; filter hanya menyembunyikan baris.
  // (Sebelumnya dihitung ulang dari baris yang lolos filter → saldo tampak lebih besar dari kenyataan.)
  const ledgerPenuh = useMemo(function() {
    if (!periode) return [];
    return buildLedger(periode.saldoVA, periode.saldoPettyAwal, vaTopups, transaksi, 'anggaran');
  }, [periode, vaTopups, transaksi]);
  const filterAktif = filterJenis !== 'ALL' || !!q.trim();
  const ledger = useMemo(function() {
    if (!filterAktif) return ledgerPenuh;
    const lolos = {};
    filteredTx.forEach(function(t){ lolos[t.id] = true; });
    return ledgerPenuh.filter(function(r){ return r.kind === 'awal' || (r.kind === 'tx' && lolos[r.tx.id]); });
  }, [ledgerPenuh, filteredTx, filterAktif]);
  const totalKreditTersaring = filterAktif ? ledger.reduce(function(s, r){ return s + (r.kredit || 0); }, 0) : 0;

  async function doDelete() {
    const res = await api('deleteTransaksi', { role: session.user.role, user_id: session.user.id, dapur: session.user.dapur, id: confirmDel.id });
    if (res.ok) { toast('Transaksi dihapus'); setConfirmDel(null); loadData(); }
    else toast(res.error || 'Gagal hapus', 'error');
  }

  if (loading && !periode) return <Card>{I.spinner}</Card>;

  const periodeAktif = periode && periode.status === 'AKTIF';
  const pendingByTx = {};
  changes.forEach(function(c){ if (c.status === 'MENUNGGU') pendingByTx[c.transaksi_id] = c; });

  return (
    <div>
      <Card pad={false} className="mb-3">
        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-3 p-4" style={{ borderBottom: '1px solid ' + COLORS.line }}>
          <div className="flex flex-col sm:flex-row gap-2 flex-1">
            <div className="flex-1 min-w-0">
              <div className="text-xs font-medium mb-1" style={{ color: COLORS.muted }}>Periode</div>
              <select value={selPeriode} onChange={function(e){setSelPeriode(e.target.value);}} style={Object.assign({}, inputStyle, { fontSize: 13 })}>
                {periodeList.length === 0 && <option value="">Belum ada periode</option>}
                {periodeList.map(function(p){
                  return <option key={p.id} value={p.id}>{(session.user.role === 'admin' || session.user.role === 'yayasan') && dapurMap[p.dapur] ? (dapurMap[p.dapur] + ' · ') : ''}Periode {p.periode_no} · {fmtDateRange(p.tanggal_mulai, p.tanggal_akhir)} · {p.status}</option>;
                })}
              </select>
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-xs font-medium mb-1" style={{ color: COLORS.muted }}>Jenis</div>
              <select value={filterJenis} onChange={function(e){setFilterJenis(e.target.value);}} style={Object.assign({}, inputStyle, { fontSize: 13 })}>
                <option value="ALL">Semua</option>
                <option value="Bahan Baku">Bahan Baku</option>
                <option value="Operasional">Operasional</option>
                <option value="Fasilitas SPPG">Fasilitas SPPG</option>
              </select>
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-xs font-medium mb-1" style={{ color: COLORS.muted }}>Cari</div>
              <input value={q} onChange={function(e){setQ(e.target.value);}} placeholder="uraian, no bukti…"
                style={Object.assign({}, inputStyle, { fontSize: 13 })} />
            </div>
          </div>
          <Btn kind="ghost" onClick={function(){
            exportRiwayatExcel(ledger, dapurMap, 'riwayat-mbg-' + (selPeriode || 'all') + (filterAktif ? '-tersaring' : '') + '.xlsx')
              .catch(function(e){ toast('Gagal membuat Excel: ' + e.message, 'error'); });
          }} disabled={ledger.length === 0}>{I.download} Excel</Btn>
        </div>
        {filterAktif && !loading && <div className="px-4 py-2.5 text-xs" style={{ background: '#FBF3E2', color: '#9A6A0B', borderBottom: '1px solid ' + COLORS.line }}>
          Filter aktif: {ledger.filter(function(r){ return r.kind === 'tx'; }).length} dari {transaksi.length} transaksi · total kredit tersaring <b className="num">{fmt(totalKreditTersaring)}</b>.
          {' '}Kolom <b>Saldo</b> tetap saldo berjalan dari <b>seluruh</b> transaksi (termasuk top-up dan transaksi yang disembunyikan), jadi selisih antarbaris tidak selalu sama dengan kredit baris itu.
        </div>}

        {loading ? <div className="p-6">{I.spinner}</div> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm" style={{ minWidth: 1000 }}>
              <thead>
                <tr style={{ color: COLORS.muted, background: COLORS.paper }} className="text-left text-xs uppercase">
                  <th className="px-3 py-2.5 font-semibold">Tanggal</th>
                  <th className="px-3 py-2.5 font-semibold">No Bukti</th>
                  <th className="px-3 py-2.5 font-semibold">Uraian Transaksi</th>
                  <th className="px-3 py-2.5 font-semibold text-right">Debit</th>
                  <th className="px-3 py-2.5 font-semibold text-right">Kredit</th>
                  <th className="px-3 py-2.5 font-semibold text-right">Saldo</th>
                  <th className="px-3 py-2.5 font-semibold text-center" style={{ width: 60 }}>Bukti</th>
                  {canEdit && <th className="px-3 py-2.5 font-semibold" style={{ width: periodeAktif ? 100 : 170 }}></th>}
                </tr>
              </thead>
              <tbody>
                {ledger.length === 0 ? (
                  <tr><td colSpan={canEdit ? 8 : 7} className="px-4 py-8 text-center" style={{ color: COLORS.muted }}>Belum ada data di periode ini.</td></tr>
                ) : ledger.map(function(row, idx){
                  const isAwal = row.kind === 'awal';
                  const isTopup = row.kind === 'topup';
                  const isTx = row.kind === 'tx';
                  return <tr key={idx} style={{ borderTop: '1px solid ' + COLORS.line, background: isAwal ? '#F0F7F2' : (isTopup ? '#F0F4FA' : 'transparent') }}>
                    <td className="px-3 py-2" style={{ color: COLORS.muted }}>{row.kind === 'awal' ? '-' : fmtDDMMYYYY(row.tanggal)}</td>
                    <td className="px-3 py-2 text-xs" style={{ color: COLORS.muted }}>{row.no_bukti}</td>

                        <span className="rounded px-1.5 py-0.5 mr-1" style={{ background: COLORS.paper }}>{row.tx.jenis}</span>
                        <span>{row.tx.kategori}</span>
                        <span className="ml-1.5">·</span>
                        <span className="ml-1.5">{row.tx.sumber}</span>

                        <TxSourceBadge tx={row.tx}/>
                      </div>}
                    </td>
                    <td className="px-3 py-2 text-right font-medium num" style={{ color: row.debit ? COLORS.green : COLORS.muted }}>{row.debit ? fmt(row.debit) : '-'}</td>
                    <td className="px-3 py-2 text-right font-medium num" style={{ color: row.kredit ? COLORS.danger : COLORS.muted }}>{row.kredit ? fmt(row.kredit) : '-'}</td>
                    <td className="px-3 py-2 text-right font-semibold num" style={{ color: COLORS.ink }}>{fmt(row.saldo)}</td>
                    <td className="px-3 py-2 text-center">
                      {isTx && row.tx && row.tx.bukti_url ? (

                          className="inline-flex items-center justify-center rounded p-1.5"

                      ) : (
                        <span className="text-[10px]" style={{ color: COLORS.muted }}>—</span>
                      )}
                    </td>
                    {canEdit && <td className="px-3 py-2 text-right">
                      {isTx && periodeAktif && (
                        <div className="flex gap-1 justify-end">
                          <button onClick={function(){setEditTrx(row.tx);}} title="Edit"
                            style={{ color: COLORS.blue, border: '1px solid ' + COLORS.line, borderRadius: 6, padding: 5 }}>{I.edit}</button>
                          <button onClick={function(){setConfirmDel(row.tx);}} title="Hapus"
                            style={{ color: COLORS.danger, border: '1px solid ' + COLORS.line, borderRadius: 6, padding: 5 }}>{I.trash}</button>
                        </div>
                      )}
                      {isTx && !periodeAktif && (pendingByTx[row.tx.id]
                        ? <MiniBadge bg="#FBF3E2" fg="#9A6A0B">Menunggu admin</MiniBadge>
                        : <div className="flex gap-1 justify-end">
                            <button onClick={function(){setEditTrx(Object.assign({}, row.tx, { _request: true }));}} title="Ajukan perubahan ke admin"
                              className="text-[10px] font-semibold rounded px-1.5 py-1" style={{ color: COLORS.blue, border: '1px solid ' + COLORS.line }}>Ajukan ubah</button>
                            <button onClick={function(){setHapusReq(row.tx);}} title="Ajukan hapus ke admin"
                              className="text-[10px] font-semibold rounded px-1.5 py-1" style={{ color: COLORS.danger, border: '1px solid ' + COLORS.line }}>Ajukan hapus</button>
                          </div>)}
                    </td>}
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {canEdit && changes.length > 0 && <TxChangeList changes={changes}/>}
      {hapusReq && <HapusRequestModal trx={hapusReq} toast={toast} onClose={function(){setHapusReq(null);}} onSaved={loadData}/>}
      {editTrx && isLinkedTx(editTrx) && (
        <EditRealisasiModal trx={editTrx} periode={periode} session={session} toast={toast} requestMode={!!editTrx._request}
          hasFee={transaksi.some(function(t){ return t.pengajuan_item_id === 'ADMIN:' + editTrx.pengajuan_item_id; })}
          onClose={function(){setEditTrx(null);}} onSaved={loadData}/>
      )}
      {editTrx && !isLinkedTx(editTrx) && (
        <EditTransaksiModal trx={editTrx} kategoriMap={kategoriMap} periode={periode} requestMode={!!editTrx._request}
          session={session} toast={toast}
          onClose={function(){setEditTrx(null);}}
          onSaved={loadData}/>
      )}
      {confirmDel && (
        <ConfirmModal title="Hapus Transaksi"
          message={'Hapus transaksi "' + confirmDel.uraian + '" (' + fmt(confirmDel.riil) + ')? Tidak bisa dibatalkan.' +
            (isFeeTx(confirmDel) ? ' Hanya biaya admin yang dihapus; realisasinya tetap.' :
             isLinkedTx(confirmDel) ? ' Baris pengajuannya akan kembali berstatus Disetujui (belum terealisasi). Biaya admin terkait ikut terhapus.' : '')}
          onConfirm={doDelete} onClose={function(){setConfirmDel(null);}} confirmLabel="Hapus" danger/>
      )}
    </div>
  );
}

//  BUKU BESAR — dual-mode ledger (Aktual + Anggaran side-by-side)
//  Buat audit & perbandingan: kredit & saldo punya 2 kolom

async function bukuBesarExportExcel(rows, dapurMap, namaFile) {
  await ensureXLSX();
  const data = rows.map(function(r){
    return {
      'Tanggal': r.tanggal === '-' ? '-' : fmtDDMMYYYY(r.tanggal),
      'No Bukti': r.no_bukti, 'Uraian': r.uraian,
      'Debit': r.debit || 0,
      'Kredit Aktual': r.kreditAktual || 0, 'Kredit Anggaran': r.kreditAnggaran || 0,
      'Saldo Aktual': r.saldoAktual || 0, 'Saldo Anggaran': r.saldoAnggaran || 0,
      'Selisih Saldo': (r.saldoAnggaran || 0) - (r.saldoAktual || 0),
      'Jenis': r.tx ? r.tx.jenis : (r.kind === 'topup' ? 'Top-up VA' : 'Saldo Awal'),
      'Kategori': r.tx ? r.tx.kategori : '',
      'Sumber': r.tx ? r.tx.sumber : '',
      'Dapur': r.tx ? (dapurMap[r.tx.dapur] || r.tx.dapur) : '',
      'Bukti URL': r.tx ? (r.tx.bukti_url || '') : '',
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [
    { wch: 12 }, { wch: 14 }, { wch: 36 }, { wch: 14 },
    { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 },
    { wch: 14 }, { wch: 26 }, { wch: 12 }, { wch: 24 }, { wch: 50 },
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Buku Besar');
  XLSX.writeFile(wb, namaFile);
}

function BukuBesar({ session, scope, toast }) {
  const [periodeList, setPeriodeList] = useState([]);
  const [selPeriode, setSelPeriode] = useState('');
  const [transaksi, setTransaksi] = useState([]);
  const [vaTopups, setVaTopups] = useState([]);
  const [dapur, setDapur] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(function() {
    Promise.all([
      api('getPeriodeList', { role: session.user.role, dapur: scope, scope: scope }),
      api('getDapur'),
    ]).then(function(arr){
      if (arr[0].ok) {
        setPeriodeList(arr[0].data);
        const aktif = arr[0].data.find(function(p){return p.status === 'AKTIF';});
        if (aktif) setSelPeriode(aktif.id);
        else if (arr[0].data[0]) setSelPeriode(arr[0].data[0].id);
        else setLoading(false);
      } else setLoading(false);
      if (arr[1].ok) setDapur(arr[1].data);
    });
  }, [scope]);

  useEffect(function() {
    if (!selPeriode) return;
    setLoading(true);
    const selObj = periodeList.find(function(p){return p.id === selPeriode;});
    const dapurId = selObj ? selObj.dapur : (scope && scope !== 'ALL' ? scope : (session.user.dapur || ''));
    Promise.all([
      api('getTransaksi', { role: session.user.role, dapur: session.user.dapur || '', scope: scope || 'ALL', periode_id: selPeriode }),
      api('getVATopups', { dapur: dapurId, periode_id: selPeriode }),
    ]).then(function(arr){
      setLoading(false);
      if (arr[0].ok) setTransaksi(arr[0].data);
      if (arr[1].ok) setVaTopups(arr[1].data);
    });
  }, [selPeriode, scope, periodeList]);

  const periode = periodeList.find(function(p){return p.id === selPeriode;});
  const dapurMap = useMemo(function(){ const m = {}; dapur.forEach(function(d){ m[d.id] = d.nama; }); return m; }, [dapur]);

  const ledger = useMemo(function(){
    if (!periode) return [];
    return buildDualLedger(periode.saldoVA, periode.saldoPettyAwal, vaTopups, transaksi);
  }, [periode, vaTopups, transaksi]);

  const totalKreditAktual = ledger.reduce(function(s,r){ return s + (r.kreditAktual||0); }, 0);
  const totalKreditAnggaran = ledger.reduce(function(s,r){ return s + (r.kreditAnggaran||0); }, 0);
  const saldoAkhirAktual = ledger.length > 0 ? ledger[ledger.length-1].saldoAktual : 0;
  const saldoAkhirAnggaran = ledger.length > 0 ? ledger[ledger.length-1].saldoAnggaran : 0;
  const selisihKredit = totalKreditAnggaran - totalKreditAktual;
  const selisihSaldo = saldoAkhirAnggaran - saldoAkhirAktual;

  if (loading) return <Card>{I.spinner}</Card>;

  return (
    <div>
      <Card className="mb-3">
        <Eyebrow>Periode</Eyebrow>
        <div className="flex flex-col sm:flex-row sm:items-end gap-3 mt-1">
          <div className="flex-1 min-w-0">
            <select value={selPeriode} onChange={function(e){setSelPeriode(e.target.value);}} style={inputStyle}>
              {periodeList.length === 0 && <option value="">Belum ada periode</option>}
              {periodeList.map(function(p){
                return <option key={p.id} value={p.id}>{(session.user.role === 'admin' || session.user.role === 'yayasan') && dapurMap[p.dapur] ? (dapurMap[p.dapur] + ' · ') : ''}Periode {p.periode_no} · {fmtDateRange(p.tanggal_mulai, p.tanggal_akhir)} · {p.status}</option>;
              })}
            </select>
          </div>
          <Btn kind="ghost" onClick={function(){
            bukuBesarExportExcel(ledger, dapurMap, 'buku-besar-' + (selPeriode || 'all') + '.xlsx')
              .catch(function(e){ toast('Gagal membuat Excel: ' + e.message, 'error'); });
          }} disabled={ledger.length === 0}>{I.download} Excel</Btn>
        </div>
        <p className="text-xs mt-2" style={{ color: COLORS.muted }}>
          Menampilkan <b>Realisasi Aktual</b> dan <b>Realisasi Anggaran</b> berdampingan untuk audit.
        </p>
      </Card>

      {/* RINGKASAN PERBANDINGAN */}
      {ledger.length > 1 && (
        <Card className="mb-3">
          <Eyebrow>Ringkasan</Eyebrow>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 mt-2">
            <div className="rounded p-3" style={{ background: COLORS.paper }}>
              <div className="text-xs" style={{ color: COLORS.muted }}>Total Kredit Aktual</div>
              <div className="font-bold num text-base" style={{ color: COLORS.green }}>{fmt(totalKreditAktual)}</div>
            </div>
            <div className="rounded p-3" style={{ background: COLORS.paper }}>
              <div className="text-xs" style={{ color: COLORS.muted }}>Total Kredit Anggaran</div>
              <div className="font-bold num text-base" style={{ color: COLORS.amber }}>{fmt(totalKreditAnggaran)}</div>
            </div>
            <div className="rounded p-3" style={{ background: COLORS.paper }}>
              <div className="text-xs" style={{ color: COLORS.muted }}>Saldo Akhir Aktual</div>
              <div className="font-bold num text-base" style={{ color: COLORS.green }}>{fmt(saldoAkhirAktual)}</div>
            </div>
            <div className="rounded p-3" style={{ background: COLORS.paper }}>
              <div className="text-xs" style={{ color: COLORS.muted }}>Saldo Akhir Anggaran</div>
              <div className="font-bold num text-base" style={{ color: COLORS.amber }}>{fmt(saldoAkhirAnggaran)}</div>
            </div>
          </div>
          <div className="mt-3 p-3 rounded" style={{ background: '#FFF9E8', border: '1px solid #F3E2A8' }}>
            <div className="text-xs" style={{ color: COLORS.muted }}>Selisih Markup (Anggaran − Aktual)</div>
            <div className="flex gap-6 mt-1 text-sm">
              <div>Kredit: <b className="num" style={{ color: COLORS.ink }}>{fmt(selisihKredit)}</b></div>
              <div>Saldo: <b className="num" style={{ color: COLORS.ink }}>{fmt(selisihSaldo)}</b></div>
            </div>
          </div>
        </Card>
      )}

      <Card pad={false}>
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ minWidth: 1200 }}>
            <thead>
              <tr style={{ color: COLORS.muted, background: COLORS.paper }} className="text-left text-xs uppercase">
                <th className="px-3 py-2.5 font-semibold">Tanggal</th>
                <th className="px-3 py-2.5 font-semibold">No Bukti</th>
                <th className="px-3 py-2.5 font-semibold">Uraian</th>
                <th className="px-3 py-2.5 font-semibold text-right">Debit</th>
                <th className="px-3 py-2.5 font-semibold text-right" style={{ background: '#E8F1EC' }}>Kredit Aktual</th>
                <th className="px-3 py-2.5 font-semibold text-right" style={{ background: '#FAF1DC' }}>Kredit Anggaran</th>
                <th className="px-3 py-2.5 font-semibold text-right" style={{ background: '#E8F1EC' }}>Saldo Aktual</th>
                <th className="px-3 py-2.5 font-semibold text-right" style={{ background: '#FAF1DC' }}>Saldo Anggaran</th>
                <th className="px-3 py-2.5 font-semibold text-center" style={{ width: 60 }}>Bukti</th>
              </tr>
            </thead>
            <tbody>
              {ledger.length === 0 ? (
                <tr><td colSpan="9" className="px-4 py-8 text-center" style={{ color: COLORS.muted }}>Belum ada data.</td></tr>
              ) : ledger.map(function(row, idx){
                const isAwal = row.kind === 'awal', isTopup = row.kind === 'topup', isTx = row.kind === 'tx';
                const selisihRow = (row.saldoAnggaran||0) - (row.saldoAktual||0);
                return <tr key={idx} style={{ borderTop: '1px solid ' + COLORS.line, background: isAwal ? '#F0F7F2' : (isTopup ? '#F0F4FA' : 'transparent') }}>
                  <td className="px-3 py-2" style={{ color: COLORS.muted }}>{row.kind === 'awal' ? '-' : fmtDDMMYYYY(row.tanggal)}</td>
                  <td className="px-3 py-2 text-xs" style={{ color: COLORS.muted }}>{row.no_bukti}</td>
                  <td className="px-3 py-2" style={{ color: COLORS.ink, fontStyle: isAwal||isTopup ? 'italic' : 'normal' }}>
                    <div>{row.uraian}</div>
                    {isTx && row.tx && <div className="text-[11px] mt-0.5" style={{ color: COLORS.muted }}>
                      <span className="rounded px-1.5 py-0.5 mr-1" style={{ background: COLORS.paper }}>{row.tx.jenis}</span>
                      <span>{row.tx.kategori}</span>
                      <span className="ml-1.5">·</span><span className="ml-1.5">{row.tx.sumber}</span>
                    </div>}
                  </td>
                  <td className="px-3 py-2 text-right font-medium num" style={{ color: row.debit ? COLORS.green : COLORS.muted }}>{row.debit ? fmt(row.debit) : '-'}</td>
                  <td className="px-3 py-2 text-right font-medium num" style={{ color: row.kreditAktual ? COLORS.danger : COLORS.muted, background: '#F3F8F5' }}>{row.kreditAktual ? fmt(row.kreditAktual) : '-'}</td>
                  <td className="px-3 py-2 text-right font-medium num" style={{ color: row.kreditAnggaran ? COLORS.amber : COLORS.muted, background: '#FDF7EA' }}>{row.kreditAnggaran ? fmt(row.kreditAnggaran) : '-'}</td>
                  <td className="px-3 py-2 text-right font-semibold num" style={{ color: COLORS.ink, background: '#F3F8F5' }}>{fmt(row.saldoAktual)}</td>
                  <td className="px-3 py-2 text-right font-semibold num" style={{ color: COLORS.ink, background: '#FDF7EA' }}>
                    {fmt(row.saldoAnggaran)}
                    {selisihRow > 0 && <div className="text-[9px]" style={{ color: COLORS.muted }}>+{fmt(selisihRow)}</div>}
                  </td>
                  <td className="px-3 py-2 text-center">
                    {isTx && row.tx && row.tx.bukti_url ? (
                      <a href={row.tx.bukti_url} target="_blank" rel="noopener" title="Lihat bukti"
                        className="inline-flex items-center justify-center rounded p-1.5"
                        style={{ color: COLORS.green, border: '1px solid ' + COLORS.line }}>{I.image}</a>
                    ) : (
                      <span className="text-[10px]" style={{ color: COLORS.muted }}>—</span>
                    )}
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

  const [confirmDel, setConfirmDel] = useState(null);
  const [deleting, setDeleting] = useState(false);

  function loadDapur() {
    api('getDapur').then(function(r){ if (r.ok) setDapur(r.data); });
  }
  const loadPeriode = useCallback(function() {
    setLoading(true);
    api('getPeriodeList', { role: session.user.role, scope: selDapur }).then(function(r){
      setLoading(false);
      if (r.ok) setPeriodeList(r.data); else toast(r.error, 'error');
    });
  }, [selDapur]);

  useEffect(function(){ loadDapur(); }, []);

            <option value="ALL">Semua dapur</option>

      <div className="p-4 pb-2">
        <div className="rounded-lg p-3 mb-2 flex items-start gap-2" style={{ background: '#FAE5DF' }}>
          <span style={{ color: COLORS.danger }}>{I.warn}</span>
          <div className="text-xs" style={{ color: COLORS.ink }}>
            <b>Hati-hati:</b> Menghapus periode akan ikut menghapus <b>semua transaksi, top-up VA, dan top-up Petty Cash</b> di periode itu. Tindakan ini permanen dan tidak bisa dibatalkan.
          </div>
        </div>
      </div>

      {loading ? <div className="p-6">{I.spinner}</div> : (
        <div className="overflow-x-auto">
          <table className="w-full text-sm" style={{ minWidth: 700 }}>
            <thead>
              <tr style={{ color: COLORS.muted, background: COLORS.paper }} className="text-left text-xs uppercase">
                <th className="px-4 py-2.5 font-semibold">Dapur</th>
                <th className="px-4 py-2.5 font-semibold">Periode</th>
                <th className="px-4 py-2.5 font-semibold">Rentang</th>
                <th className="px-4 py-2.5 font-semibold text-right">Saldo VA Awal</th>
                <th className="px-4 py-2.5 font-semibold">Status</th>
                <th className="px-4 py-2.5 font-semibold"></th>

            </thead>

              {periodeList.length === 0 ? (
                <tr><td colSpan="6" className="px-4 py-8 text-center" style={{ color: COLORS.muted }}>Belum ada periode.</td></tr>

                return <tr key={p.id} style={{ borderTop: '1px solid ' + COLORS.line }}>
                  <td className="px-4 py-2.5" style={{ color: COLORS.ink }}>{dapurMap[p.dapur] || p.dapur}</td>

function Profil({ session, toast, onUpdated }) {
  const [f, setF] = useState({ nama: session.user.nama, username: session.user.username,
    password_lama: '', password_baru: '', password_baru2: '' });
  const [saving, setSaving] = useState(false);
  function set(k, v) { setF(function(p){ const n = Object.assign({}, p); n[k] = v; return n; }); }

  async function submit() {
    if (!f.nama || !f.username) { toast('Nama & username wajib', 'error'); return; }
    if (f.password_baru || f.password_baru2 || f.password_lama) {
      if (!f.password_lama) { toast('Isi password lama untuk ganti password', 'error'); return; }
      if (!f.password_baru) { toast('Isi password baru', 'error'); return; }
      if (f.password_baru !== f.password_baru2) { toast('Konfirmasi password tidak cocok', 'error'); return; }
    }
    setSaving(true);
    const payload = { user_id: session.user.id, nama: f.nama, username: f.username };
    if (f.password_baru) { payload.password_lama = f.password_lama; payload.password_baru = f.password_baru; }
    const res = await apiSecure('updateMyProfile', payload);
    setSaving(false);
    if (res.ok) {
      toast('Profil tersimpan');
      onUpdated && onUpdated({ nama: f.nama, username: f.username });
      set('password_lama', ''); set('password_baru', ''); set('password_baru2', '');
    } else toast(res.error || 'Gagal simpan', 'error');
  }

  return (
    <div className="max-w-xl">
      {session.user.role === 'akuntan' && <TtdCard toast={toast}/>}
      <Card className="mb-3">
        <Eyebrow>Akun saya</Eyebrow>
        <div className="grid grid-cols-2 gap-3 mt-2 mb-3">
          <div className="rounded p-3" style={{ background: COLORS.paper }}>
            <div className="text-xs" style={{ color: COLORS.muted }}>Peran</div>
            <div className="font-semibold" style={{ color: COLORS.ink, textTransform: 'capitalize' }}>{session.user.role}</div>
          </div>
          <div className="rounded p-3" style={{ background: COLORS.paper }}>
            <div className="text-xs" style={{ color: COLORS.muted }}>Dapur</div>
            <div className="font-semibold" style={{ color: COLORS.ink }}>{session.user.dapur || '—'}</div>
          </div>
        </div>
        <Field label="Nama lengkap"><input value={f.nama} onChange={function(e){set('nama', e.target.value);}} style={inputStyle}/></Field>
        <Field label="Username"><input value={f.username} onChange={function(e){set('username', e.target.value);}} style={inputStyle} autoCapitalize="off"/></Field>
      </Card>
      <Card>
        <Eyebrow>Ganti password</Eyebrow>
        <p className="text-xs mb-3 mt-1" style={{ color: COLORS.muted }}>Kosongkan semua field di bawah kalau tidak ingin ganti password.</p>
        <Field label="Password lama"><input type="password" value={f.password_lama} onChange={function(e){set('password_lama', e.target.value);}} style={inputStyle}/></Field>
        <Field label="Password baru"><input type="password" value={f.password_baru} onChange={function(e){set('password_baru', e.target.value);}} style={inputStyle}/></Field>
        <Field label="Konfirmasi password baru"><input type="password" value={f.password_baru2} onChange={function(e){set('password_baru2', e.target.value);}} style={inputStyle}/></Field>
        <Btn onClick={submit} disabled={saving}>{saving ? I.spinner : I.check} Simpan Perubahan</Btn>
      </Card>
    </div>
  );
}

            <td className="px-4 py-2.5">
              <div className="flex gap-1 justify-end">
                <button onClick={function(){setEditUser(u);}} title="Edit"

function UserForm({ mode, initial, dapur, session, toast, onClose, onSaved }) {
  const [f, setF] = useState(initial ? {
    username: initial.username, password: '', nama: initial.nama,
    target_role: initial.role, dapur: initial.dapur || '', aktif: initial.aktif,
  } : { username:'', password:'', nama:'', target_role:'akuntan', dapur:'', aktif: 'YA' });
  const [saving, setSaving] = useState(false);

  async function submit() {
    if (!f.username || !f.nama) { toast('Lengkapi data', 'error'); return; }
    if (mode === 'add' && !f.password) { toast('Password wajib untuk user baru', 'error'); return; }
    setSaving(true);
    const action = mode === 'edit' ? 'updateUser' : 'addUser';
    const payload = Object.assign({ role: session.user.role, user_id: session.user.id, target_role: f.target_role }, f);
    if (f.target_role !== 'akuntan' && f.target_role !== 'pic') payload.dapur = '';
    if (mode === 'edit') { payload.id = initial.id; if (!f.password) delete payload.password; }
    const res = await apiSecure(action, payload);
    setSaving(false);
    if (res.ok) { toast(mode==='edit'?'User diupdate':'User ditambahkan'); onSaved(); onClose(); }
    else toast(res.error, 'error');
  }

  return <Modal title={mode === 'edit' ? 'Edit pengguna' : 'Tambah pengguna'} onClose={onClose}>
    <Field label="Nama lengkap"><input value={f.nama} onChange={function(e){setF(Object.assign({}, f, {nama:e.target.value}));}} style={inputStyle}/></Field>
    <Field label="Username"><input value={f.username} onChange={function(e){setF(Object.assign({}, f, {username:e.target.value}));}} style={inputStyle} autoCapitalize="off"/></Field>
    <Field label={mode === 'edit' ? 'Password baru (kosongkan kalau tidak ganti)' : 'Password awal'} hint="Password tidak bisa dilihat lagi setelah disimpan. Catat dan sampaikan ke pengguna; pengguna bisa menggantinya di menu Profil.">
      <input value={f.password} onChange={function(e){setF(Object.assign({}, f, {password:e.target.value}));}} style={inputStyle} autoComplete="new-password"/>
    </Field>
    <Field label="Peran">
      <select value={f.target_role} onChange={function(e){setF(Object.assign({}, f, {target_role:e.target.value}));}} style={inputStyle}>
        <option value="akuntan">Akuntan</option><option value="pic">PIC Dapur</option>
        <option value="yayasan">Yayasan</option><option value="asisten">Asisten (pengajuan Bahan Baku semua dapur)</option><option value="admin">Admin</option>
      </select>
    </Field>
    {(f.target_role==='akuntan'||f.target_role==='pic') && (
      <Field label="Dapur">
        <select value={f.dapur} onChange={function(e){setF(Object.assign({}, f, {dapur:e.target.value}));}} style={inputStyle}>
          <option value="">Pilih dapur…</option>
          {dapur.map(function(d){ return <option key={d.id} value={d.id}>{d.nama}</option>; })}
        </select>
      </Field>
    )}
    {mode === 'edit' && (
      <Field label="Status">
        <select value={f.aktif} onChange={function(e){setF(Object.assign({}, f, {aktif:e.target.value}));}} style={inputStyle}>
          <option value="YA">Aktif</option><option value="TIDAK">Non-aktif</option>
        </select>
      </Field>
    )}
    <div className="flex gap-2"><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={submit} disabled={saving}>{saving ? I.spinner : I.check} Simpan</Btn></div>
  </Modal>;
}

const BANK_LIST = ['BCA','BRI','BNI','Mandiri','BSI','BJB','BTN','CIMB Niaga','Danamon','Permata','OCBC','Bank Jago','SeaBank','BPR'];
function PenerimaForm({ initial, onClose, onSaved, toast }) {
  const [f, setF] = useState(Object.assign({ nama: '', bank: '', no_rek: '' }, initial || {}));
  const [saving, setSaving] = useState(false);
  const rekChanged = initial && (initial.bank !== f.bank || initial.no_rek !== f.no_rek.replace(/[\s.-]/g, ''));
  function set(k, v) { setF(Object.assign({}, f, { [k]: v })); }
  async function submit() {
    if (!f.nama.trim() || !f.bank.trim() || !f.no_rek.trim()) { toast('Nama, bank, dan nomor rekening wajib', 'error'); return; }
    setSaving(true);
    const res = await api('savePenerima', { id: initial ? initial.id : '', nama: f.nama.trim(), bank: f.bank.trim(), no_rek: f.no_rek.replace(/[\s.-]/g, '') });
    setSaving(false);
    if (res.ok) { toast(initial ? 'Penerima diperbarui' : 'Penerima ditambahkan'); onSaved(res.data); onClose(); }
    else toast(res.error || 'Gagal menyimpan', 'error');
  }
  return <Modal title={initial ? 'Ubah penerima' : 'Tambah penerima baru'} onClose={onClose}>
    <Field label="Nama penerima *" hint="Nama toko / orang / instansi tujuan transfer"><input value={f.nama} onChange={function(e){set('nama', e.target.value);}} style={inputStyle} placeholder="cth. Toko Beras Barokah"/></Field>
    <Field label="Bank *">
      <input value={f.bank} onChange={function(e){set('bank', e.target.value);}} list="bank-list-v6" style={inputStyle} placeholder="Pilih atau ketik nama bank"/>
      <datalist id="bank-list-v6">{BANK_LIST.map(function(b){ return <option key={b} value={b}/>; })}</datalist>
    </Field>
    <Field label="Nomor rekening *" hint="Angka saja. Periksa ulang — aplikasi tidak bisa mencocokkan nama pemilik rekening.">
      <input value={f.no_rek} onChange={function(e){set('no_rek', e.target.value.replace(/[^\d\s.-]/g, ''));}} inputMode="numeric" style={inputStyle} placeholder="1234567890"/>
    </Field>
    {rekChanged && <div className="text-xs rounded-lg p-2.5 mb-3" style={{ background: '#FBF3E2', color: '#9A6A0B' }}>
      Perubahan bank/nomor rekening akan <b>ditandai ke Yayasan</b> pada pengajuan berikutnya ke penerima ini.
    </div>}
    <div className="flex gap-2 justify-end"><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={submit} disabled={saving}>{saving ? I.spinner : I.check} Simpan</Btn></div>
  </Modal>;
}

function PenerimaSelect({ list, value, onChange, onListChange, toast }) {
  const [form, setForm] = useState(null); // null | 'new' | penerima obj
  const cur = list.find(function(p){ return p.id === value; });
  return <div>
    <div className="flex gap-1.5">

        <option value="">Pilih penerima…</option>
        {list.map(function(p){ return <option key={p.id} value={p.id}>{p.nama} — {p.bank} {p.no_rek}</option>; })}
      </select>
      <button type="button" onClick={function(){ setForm('new'); }} title="Tambah penerima baru"
        className="rounded-lg px-2.5 shrink-0" style={{ border: '1px solid ' + COLORS.line, color: COLORS.green }}>{I.plusSm}</button>
      {cur && <button type="button" onClick={function(){ setForm(cur); }} title="Ubah data penerima"
        className="rounded-lg px-2.5 shrink-0" style={{ border: '1px solid ' + COLORS.line, color: COLORS.blue }}>{I.edit}</button>}

function usePenerimaList() {
  const [list, setList] = useState([]);
  const reload = useCallback(function() { api('getPenerima').then(function(r){ if (r.ok) setList(r.data); }); }, []);
  useEffect(reload, []);
  function upsert(saved) {
    setList(function(l) {
      const other = l.filter(function(p){ return p.id !== saved.id; });
      return other.concat([Object.assign({ aktif: true }, saved)]).sort(function(a,b){ return a.nama.localeCompare(b.nama); });
    });
  }
  return [list, upsert, reload];
}

// ---------- Baris pengajuan (form) ----------
function emptyRow() { return { key: Math.random().toString(36).slice(2), jenis: '', kategori: '', uraian: '', nominal: '', penerima_id: '', susulan: false }; }
function rowError(r) {
  if (!r.jenis) return 'jenis'; if (!r.kategori) return 'kategori'; if (!String(r.uraian).trim()) return 'uraian';
  if (!(Number(r.nominal) > 0)) return 'nominal'; if (!r.penerima_id) return 'penerima'; return null;
}
function ItemFields({ row, onChange, kategoriMap, penerima, upsertPenerima, toast }) {
  function set(k, v) { const n = Object.assign({}, row, { [k]: v }); if (k === 'jenis') n.kategori = (kategoriMap[v] || []).length === 1 ? kategoriMap[v][0] : ''; onChange(n); }
  return <div className="grid sm:grid-cols-2 gap-x-3">
    <Field label="Jenis *">
      <select value={row.jenis} onChange={function(e){ set('jenis', e.target.value); }} style={inputStyle}>
        <option value="">Pilih jenis…</option>
        {Object.keys(kategoriMap).map(function(j){ return <option key={j} value={j}>{j}</option>; })}
      </select>
    </Field>
    <Field label="Kategori *">
      <select value={row.kategori} onChange={function(e){ set('kategori', e.target.value); }} style={inputStyle} disabled={!row.jenis}>
        <option value="">{row.jenis ? 'Pilih kategori…' : 'Pilih jenis dulu'}</option>
        {(kategoriMap[row.jenis] || []).map(function(k){ return <option key={k} value={k}>{k}</option>; })}
      </select>
    </Field>
    <Field label="Uraian *"><input value={row.uraian} onChange={function(e){ set('uraian', e.target.value); }} style={inputStyle} placeholder="cth. Beras 50 kg"/></Field>
    <Field label="Nominal *"><RupiahInput value={row.nominal} onChange={function(v){ set('nominal', v); }}/></Field>
    <div className="sm:col-span-2">
      <Field label="Ditransfer ke *" hint="Bank & nomor rekening terisi otomatis dari daftar penerima">
        <PenerimaSelect list={penerima} value={row.penerima_id} onChange={function(v){ set('penerima_id', v); }} onListChange={upsertPenerima} toast={toast}/>
      </Field>
    </div>
    <label className="sm:col-span-2 flex items-start gap-2 text-sm mb-2 cursor-pointer" style={{ color: COLORS.ink }}>
      <input type="checkbox" checked={!!row.susulan} onChange={function(e){ set('susulan', e.target.checked); }} style={{ marginTop: 3 }}/>
      <span><b>Susulan</b> — barang/jasa sudah dibeli sebelum pengajuan ini <span style={{ color: COLORS.muted }}>(akan ditandai ke Yayasan)</span></span>
    </label>
  </div>;
}

// Cegah pengajuan ganda: cari pengajuan dengan isi identik (dapur + hari H + semua baris yang masih hidup).
// Dipanggil sebelum kirim, sehingga kirim ulang setelah "Koneksi gagal" (padahal server sempat menyimpan) tertangkap.
async function cariDuplikatPengajuan(items, dapur, tanggal) {
  const res = await api('getPengajuan', { scope: dapur || 'ALL' });
  if (!res.ok || !res.data || !res.data.pengajuan) return null;
  const sig = function(it) { return [it.jenis, it.kategori, String(it.uraian || '').trim().toLowerCase(), Number(it.nominal), it.penerima_id].join('|'); };
  const mine = items.map(sig).sort().join('\n');
  return res.data.pengajuan.find(function(h) {
    if (h.tanggal !== tanggal || (dapur && h.dapur !== dapur)) return false;
    const hidup = (h.items || []).filter(function(i){ return i.status !== 'DITOLAK' && i.status !== 'DIBATALKAN'; });
    return hidup.length === items.length && hidup.map(sig).sort().join('\n') === mine;
  }) || null;
}

function PengajuanForm({ kategoriMap, penerima, upsertPenerima, toast, onCreated, onCancel, dapurOptions, periodeRange, ownDapur }) {
  const [tanggal, setTanggal] = useState(todayISO());
  const onlyJenis = Object.keys(kategoriMap).length === 1 ? Object.keys(kategoriMap)[0] : '';
  function newRow() { const r = emptyRow(); if (onlyJenis) { r.jenis = onlyJenis; r.kategori = (kategoriMap[onlyJenis] || [])[0] || ''; } return r; }
  const [rows, setRows] = useState([newRow()]);
  const [dapur, setDapur] = useState('');
  const needDapur = !!dapurOptions;
  const rng = periodeRange ? periodeRange[needDapur ? dapur : ownDapur] : null;
  const tglErr = !tanggal ? 'Tanggal wajib diisi' : (rng && (tanggal < rng.mulai || tanggal > rng.akhir)) ? 'Di luar periode aktif (' + fmtDDMMYYYY(rng.mulai) + ' – ' + fmtDDMMYYYY(rng.akhir) + ')' : null;
  const [saving, setSaving] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const [dup, setDup] = useState(null);
  const lockRef = useRef(false);   // kunci sinkron: klik ganda / ketuk ulang tidak bisa lolos sebelum render ulang
  const reqId = useRef('rq-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));   // satu ID per form; dikirim agar backend bisa menolak kiriman ulang
  const total = rows.reduce(function(s, r){ return s + (Number(r.nominal) || 0); }, 0);
  const firstErr = rows.map(rowError).findIndex(function(e){ return !!e; });
  function update(i, n) { setRows(rows.map(function(r, j){ return j === i ? n : r; })); }
  async function submit(force) {
    if (lockRef.current) return;
    lockRef.current = true; setSaving(true);
    try {
      const items = rows.map(function(r){ return { jenis: r.jenis, kategori: r.kategori, uraian: r.uraian.trim(), nominal: Number(r.nominal), penerima_id: r.penerima_id, susulan: !!r.susulan }; });
      if (!force) {
        const d = await cariDuplikatPengajuan(items, needDapur ? dapur : ownDapur, tanggal);
        if (d) { setConfirm(false); setDup(d); return; }
      }
      const res = await apiPost('createPengajuan', { items: items, dapur: dapur, tanggal: tanggal, request_id: reqId.current });
      setConfirm(false);
      if (res.ok) {
        toast('Pengajuan ' + res.data.nomor + ' terkirim untuk persetujuan');
        const pmap = {}; (penerima || []).forEach(function(x){ pmap[x.id] = x; });
        onCreated({ nomor: res.data.nomor, tanggal: tanggal, dapur: dapur, items: items.map(function(it){
          const pn = pmap[it.penerima_id] || {};
          return Object.assign({}, it, { penerima_nama: pn.nama || '', bank: pn.bank || '', no_rek: pn.no_rek || '' }); }) });
      }
      else if (/^Koneksi gagal/.test(res.error || '')) toast('Koneksi terputus — pengajuan MUNGKIN sudah terkirim. Cek daftar pengajuan dulu sebelum kirim ulang.', 'error');
      else toast(res.error || 'Gagal mengirim', 'error');
    } finally { lockRef.current = false; setSaving(false); }
  }
  return <Card className="mb-3">
    <div className="flex items-start justify-between gap-2 mb-3">
      <div>
        <Eyebrow>Pengajuan baru</Eyebrow>
        <div className="text-sm" style={{ color: COLORS.muted }}>Semua baris dibayar dari VA. Satu nomor Berita Acara per dapur per tanggal pengajuan — pengajuan lain (susulan / dari asisten) dengan tanggal yang sama ikut nomor itu.</div>
      </div>
      <button onClick={onCancel} style={{ color: COLORS.muted }}>{I.x}</button>
    </div>
    {needDapur && <Field label="Untuk dapur *" hint="Satu pengajuan untuk satu dapur. Untuk dapur lain, kirim pengajuan terpisah.">
      <select value={dapur} onChange={function(e){ setDapur(e.target.value); }} style={Object.assign({}, inputStyle, dapur ? {} : { borderColor: COLORS.amber })}>
        <option value="">Pilih dapur…</option>
        {dapurOptions.map(function(d){ return <option key={d.id} value={d.id} disabled={!d.aktif}>{d.nama}{d.aktif ? '' : ' (belum ada periode aktif)'}</option>; })}
      </select>
    </Field>}
    <Field label="Tanggal pengajuan (hari H penggunaan dana) *"
      hint={tglErr ? '⚠️ ' + tglErr : tanggal < todayISO() ? 'Tanggal mundur — akan ditandai "diajukan setelah hari H" ke Yayasan' : tanggal > todayISO() ? 'Pengajuan untuk hari mendatang' : 'Hari ini'}
      hintColor={tglErr ? COLORS.danger : tanggal < todayISO() ? '#9A6A0B' : null}>
      <input type="date" value={tanggal} min={rng ? rng.mulai : undefined} max={rng ? rng.akhir : undefined}
        onChange={function(e){ setTanggal(e.target.value); }} style={Object.assign({}, inputStyle, tglErr ? { borderColor: COLORS.danger } : {})}/>
    </Field>
    {rows.map(function(r, i){
      return <div key={r.key} className="rounded-lg p-3 mb-3" style={{ border: '1px solid ' + COLORS.line, background: '#FCFBF8' }}>
        <div className="flex items-center justify-between mb-2">
          <div className="text-sm font-bold" style={{ color: COLORS.ink }}>Baris {i + 1}</div>
          {rows.length > 1 && <button onClick={function(){ setRows(rows.filter(function(_, j){ return j !== i; })); }}
            className="text-xs inline-flex items-center gap-1" style={{ color: COLORS.danger }}>{I.trash} Hapus baris</button>}
        </div>
        <ItemFields row={r} onChange={function(n){ update(i, n); }} kategoriMap={kategoriMap} penerima={penerima} upsertPenerima={upsertPenerima} toast={toast}/>
      </div>;
    })}
    <div>
      <Btn kind="ghost" onClick={function(){ setRows(rows.concat([newRow()])); }}>{I.plusSm} Tambah baris</Btn>
    </div>
    <div className="sticky-bar">
      <div className="flex items-end justify-between gap-3">
        <div>
          <div className="text-xs" style={{ color: COLORS.muted }}>Total {rows.length} baris</div>
          <div className="text-lg font-bold num leading-tight" style={{ color: COLORS.ink }}>{fmt(total)}</div>
        </div>
        <div className="text-[11px] text-right" style={{ color: COLORS.amber }}>Belum terkirim sebelum<br/>tombol Kirim ditekan</div>
      </div>
      {(needDapur && !dapur) ? <div className="text-xs mt-1.5" style={{ color: COLORS.danger }}>• Dapur tujuan belum dipilih</div>
        : tglErr ? <div className="text-xs mt-1.5" style={{ color: COLORS.danger }}>• {tglErr}</div>
        : firstErr >= 0 ? <div className="text-xs mt-1.5" style={{ color: COLORS.danger }}>• Baris {firstErr + 1}: {rowError(rows[firstErr])} belum diisi</div> : null}
      <div className="mt-2"><Btn full disabled={firstErr >= 0 || saving || (needDapur && !dapur) || !!tglErr} onClick={function(){ setConfirm(true); }}>{saving ? I.spinner : I.arrowR} Kirim untuk persetujuan</Btn></div>
    </div>
    {confirm && <ConfirmModal title="Kirim pengajuan?" confirmLabel={saving ? 'Mengirim…' : 'Kirim'}
      message={'Pengajuan tanggal ' + fmtDDMMYYYY(tanggal) + ': ' + rows.length + ' baris senilai ' + fmt(total) + (needDapur ? ' untuk ' + ((dapurOptions.find(function(d){ return d.id === dapur; }) || {}).nama || '') : '') + ' untuk persetujuan. Setelah dikirim, baris hanya bisa diedit sampai diputuskan.'}
      onConfirm={function(){ submit(false); }} onClose={function(){ setConfirm(false); }}/>}
    {dup && <ConfirmModal title="Kemungkinan pengajuan ganda" danger confirmLabel="Tetap kirim"
      message={'Sudah ada pengajuan ' + dup.nomor + ' (hari H ' + fmtDDMMYYYY(dup.tanggal) + ') dengan isi yang sama persis. Jika tadi koneksi sempat terputus, kemungkinan pengajuan itu sudah terkirim. Kirim lagi sebagai pengajuan baru?'}
      onConfirm={function(){ setDup(null); submit(true); }} onClose={function(){ setDup(null); }}/>}
  </Card>;
}

function ItemEditModal({ item, kategoriMap, penerima, upsertPenerima, toast, onClose, onSaved }) {
  const [row, setRow] = useState({ jenis: item.jenis, kategori: item.kategori, uraian: item.uraian, nominal: String(item.nominal), penerima_id: item.penerima_id, susulan: item.susulan });
  const [saving, setSaving] = useState(false);
  const err = rowError(row);
  const revisi = item.status === 'REVISI';
  async function submit() {
    setSaving(true);
    const res = await api('updatePengajuanItem', { item_id: item.id, jenis: row.jenis, kategori: row.kategori, uraian: row.uraian.trim(),
      nominal: row.nominal, penerima_id: row.penerima_id, susulan: row.susulan ? 'true' : 'false' });
    setSaving(false);
    if (res.ok) { toast(revisi ? 'Baris diajukan ulang' : 'Baris diperbarui'); onSaved(); onClose(); }
    else toast(res.error || 'Gagal menyimpan', 'error');
  }
  return <Modal title={(revisi ? 'Perbaiki & ajukan ulang' : 'Edit baris') + ' · #' + item.urut} size="lg" onClose={onClose}>
    {revisi && item.catatan && <div className="text-sm rounded-lg p-2.5 mb-3" style={{ background: '#EAF0F8', color: COLORS.blue }}>Catatan Yayasan: {item.catatan}</div>}
    <ItemFields row={row} onChange={setRow} kategoriMap={kategoriMap} penerima={penerima} upsertPenerima={upsertPenerima} toast={toast}/>
    <div className="flex gap-2 justify-end"><Btn kind="ghost" onClick={onClose}>Batal</Btn>
      <Btn onClick={submit} disabled={!!err || saving}>{saving ? I.spinner : I.check} {revisi ? 'Ajukan ulang' : 'Simpan'}</Btn></div>
  </Modal>;
}

function BatalModal({ item, toast, onClose, onSaved }) {
  const [alasan, setAlasan] = useState('');
  const [saving, setSaving] = useState(false);
  async function submit() {
    setSaving(true);
    const res = await api('batalkanItem', { item_id: item.id, alasan: alasan });
    setSaving(false);
    if (res.ok) { toast('Baris dibatalkan'); onSaved(); onClose(); } else toast(res.error || 'Gagal', 'error');

    <Field label="Alasan" hint="Opsional, tercatat di riwayat"><input value={alasan} onChange={function(e){ setAlasan(e.target.value); }} style={inputStyle} placeholder="cth. tidak jadi dibeli"/></Field>
    <div className="flex gap-2 justify-end"><Btn kind="ghost" onClick={onClose}>Kembali</Btn><Btn kind="danger" onClick={submit} disabled={saving}>{saving ? I.spinner : I.trash} Batalkan baris</Btn></div>
  </Modal>;
}

function pendingSt(it) { return it.status === 'DIAJUKAN' || it.status === 'REVISI'; }
function TimingBadge({ h }) {
  const dibuat = String(h.created_at || '').substring(0, 10);
  if (!dibuat || dibuat === h.tanggal) return null;
  if (dibuat > h.tanggal) return <MiniBadge bg="#FBF3E2" fg="#9A6A0B">Diajukan setelah hari H ({fmtDDMMYYYY(dibuat)})</MiniBadge>;
  return <MiniBadge bg="#EAF0F8" fg={COLORS.blue}>Diajukan lebih awal ({fmtDDMMYYYY(dibuat)})</MiniBadge>;
}
function ItemFlags({ it }) {
  return <>
    {it.susulan && <MiniBadge bg="#FBF3E2" fg="#9A6A0B">Susulan · sudah dibeli</MiniBadge>}
    {pendingSt(it) && it.penerima_baru && <MiniBadge bg="#EAF0F8" fg={COLORS.blue}>Penerima baru</MiniBadge>}
    {pendingSt(it) && it.rek_berubah && <MiniBadge bg="#F8E9E5" fg={COLORS.danger}>Rekening berubah</MiniBadge>}
  </>;
}

          <div className="text-[11px] mt-1.5" style={{ color: it.status === 'DIBATALKAN' ? COLORS.muted : (it.status === 'REVISI' ? COLORS.blue : COLORS.danger) }}>Catatan: {it.catatan}</div>}
      </div>

        {actions && <div className="flex gap-1 justify-end mt-1.5 flex-wrap">{actions}</div>}
      </div>
    </div>
    {children}
  </div>;
}

function VACard({ va }) {
  if (!va) return null;
  return <Card className="mb-3">
    <div className="grid grid-cols-3 gap-2">
      <div><div className="text-[11px] leading-tight" style={{ color: COLORS.muted }}>Sisa VA</div><div className="font-bold num text-sm sm:text-base" style={{ color: COLORS.ink }}>{fmt(va.sisaVA)}</div></div>
      <div><div className="text-[11px] leading-tight" style={{ color: COLORS.muted }}>Disetujui, belum realisasi</div><div className="font-bold num text-sm sm:text-base" style={{ color: COLORS.green }}>{fmt(va.komitmen)}</div></div>
      <div><div className="text-[11px] leading-tight" style={{ color: COLORS.muted }}>VA tersedia</div><div className="font-bold num text-sm sm:text-base" style={{ color: va.tersedia < 0 ? COLORS.danger : COLORS.blue }}>{fmt(va.tersedia)}</div></div>
    </div>
  </Card>;
}

// ---------- Filter tampilan bersama: Hari ini / Periode aktif / Periode ditutup ----------
// Periode ditutup tidak dimuat sampai dipilih, agar halaman tetap ringan.
const MODE_PERIODE = [['hari', 'Hari ini'], ['aktif', 'Periode aktif'], ['lalu', 'Periode ditutup']];
function usePeriodeTutup(session, aktif, scopeDapur, setPer) {
  const [periodes, setPeriodes] = useState(null);
  useEffect(function() {
    if (!aktif) return;
    let live = true;
    setPeriodes(null); setPer('');
    api('getPeriodeList', { role: session.user.role, dapur: session.user.dapur || '', scope: scopeDapur || 'ALL' }).then(function(r){
      if (!live) return;
      setPeriodes(r.ok ? r.data.filter(function(p){ return p.status !== 'AKTIF'; }).sort(function(x, y){ return x.tanggal_mulai < y.tanggal_mulai ? 1 : -1; }) : []);
    });
    return function(){ live = false; };
  }, [aktif, scopeDapur]);
  return periodes;
}
function ModePeriodeBar({ modes, mode, setMode, counts, periodes, per, setPer, multi, dapurMap }) {
  counts = counts || {};
  return <div>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(' + modes.length + ', minmax(0, 1fr))', gap: 8 }}>
      {modes.map(function(m){ const on = mode === m[0]; const c = counts[m[0]];
        return <button key={m[0]} onClick={function(){ setMode(m[0]); }} className="rounded-xl px-1.5 py-2.5 text-xs sm:text-sm font-semibold leading-tight"
          style={{ background: on ? COLORS.green : '#fff', color: on ? '#fff' : COLORS.ink, border: '1px solid ' + (on ? COLORS.green : COLORS.line) }}>
          {m[1]}{c != null && ' '}{c != null && <span className="inline-block rounded-full px-1.5 py-0.5 text-[11px]" style={{ background: on ? 'rgba(255,255,255,0.22)' : COLORS.paper, color: on ? '#fff' : COLORS.muted }}>{c}</span>}
        </button>; })}
    </div>
    {mode === 'lalu' && <div className="mt-3">
      {!periodes ? <div className="text-sm flex items-center gap-2" style={{ color: COLORS.muted }}>{I.spinner} Memuat daftar periode…</div>
        : periodes.length === 0 ? <div className="text-sm" style={{ color: COLORS.muted }}>Belum ada periode yang ditutup.</div>
        : <select value={per} onChange={function(e){ setPer(e.target.value); }} style={inputStyle}>
            <option value="">Pilih periode yang sudah ditutup…</option>
            {periodes.map(function(x){ return <option key={x.id} value={x.id}>{(multi && dapurMap[x.dapur] ? dapurMap[x.dapur] + ' · ' : '') + 'Periode ' + x.periode_no + ' · ' + fmtDateRange(x.tanggal_mulai, x.tanggal_akhir)}</option>; })}
          </select>}
    </div>}
  </div>;
}
// Kelompokkan per dapur (urut nama dapur), isi tetap urut seperti asalnya
function kelompokDapur(list, dapurMap) {
  const m = {}, order = [];
  list.forEach(function(h){ if (!m[h.dapur]) { m[h.dapur] = []; order.push(h.dapur); } m[h.dapur].push(h); });
  return order.sort(function(a, b){ return String(dapurMap[a] || a).localeCompare(String(dapurMap[b] || b)); })
    .map(function(d){ return { dapur: d, list: m[d] }; });
}
function DapurHeader({ nama, info, jumlah }) {
  return <div className="flex items-end justify-between gap-2 mt-4 mb-2 px-1">
    <div className="min-w-0">
      <div className="text-sm font-bold" style={{ color: COLORS.ink }}>{nama}</div>
      {info && <div className="text-[11px]" style={{ color: COLORS.muted }}>{info}</div>}
    </div>
    <span className="text-[11px] rounded-full px-2 py-0.5 shrink-0" style={{ background: '#fff', border: '1px solid ' + COLORS.line, color: COLORS.muted }}>{jumlah} pengajuan</span>
  </div>;
}

function PengajuanPage({ session, scope, dapurList, toast }) {
  const role = session.user.role;
  const isAkuntan = role === 'akuntan';
  const isAsisten = role === 'asisten';
  const canCreate = isAkuntan || isAsisten;
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [kategoriMap, setKategoriMap] = useState({});
  const [tab, setTab] = useState(isAsisten ? 'buat' : 'daftar');   // 'buat' = formulir, 'daftar' = sudah diajukan
  const [formKey, setFormKey] = useState(0);        // naik setelah kirim/batal → formulir kosong lagi

  const [per, setPer] = useState('');
  const [dataLalu, setDataLalu] = useState(null);
  const multiDapur = scope === 'ALL' || !scope || isAsisten;
  const scopeDapur = role === 'admin' || role === 'yayasan' ? (scope && scope !== 'ALL' ? scope : '') : '';
  const periodesTutup = usePeriodeTutup(session, mode === 'lalu', scopeDapur, setPer);
  const [editItem, setEditItem] = useState(null);
  const [batalItem, setBatalItem] = useState(null);
  const [penerima, upsertPenerima] = usePenerimaList();
  const [baList, setBaList] = useState([]);
  const [waText, setWaText] = useState(null);
  const dapurMap = useMemo(function(){ const m = {}; (dapurList || []).forEach(function(d){ m[d.id] = d.nama; }); return m; }, [dapurList]);

  const load = useCallback(async function() {
    setLoading(true);
    const res = await api('getPengajuan', { scope: scope || 'ALL' });
    setLoading(false);
    if (res.ok) setData(res.data); else toast(res.error || 'Gagal memuat pengajuan', 'error');
    if (!isAsisten) { const b = await api('getBADaftar', { mode: 'aktif' }); if (b.ok) setBaList(b.data.filter(function(g){ return g.periode_status === 'AKTIF'; })); }
  }, [scope]);
  useEffect(function() {
    setDataLalu(null);
    if (mode !== 'lalu' || !per) return;
    let live = true;
    api('getPengajuan', { scope: scope || 'ALL', periode_id: per }).then(function(r){
      if (!live) return;
      if (r.ok) setDataLalu(r.data); else { setDataLalu({ pengajuan: [] }); toast(r.error || 'Gagal memuat', 'error'); }
    });
    return function(){ live = false; };
  }, [mode, per, scope]);
  useEffect(function(){ load(); api('getKategori').then(function(r){
    if (r.ok) setKategoriMap(isAsisten ? { 'Bahan Baku': r.data['Bahan Baku'] || ['Semua Kategori'] } : r.data);
  }); }, [load]);

  if (loading && !data) return <Card><div className="flex items-center gap-2 text-sm" style={{ color: COLORS.muted }}>{I.spinner} Memuat…</div></Card>;
  if (!data) return <Card>Tidak ada data.</Card>;
  const vaKeys = Object.keys(data.va || {});
  const aktifKeys = Object.keys(data.periodeAktif || {});
  const noPeriode = aktifKeys.length === 0;
  // Urut per hari H (terbaru dulu) lalu per dapur agar 1 bar Berita Acara per dapur per hari
  function urutPengajuan(list) {
    return list.map(function(h, i){ return [h, i]; }).sort(function(a, b){
      if (a[0].tanggal !== b[0].tanggal) return a[0].tanggal < b[0].tanggal ? 1 : -1;
      if (a[0].dapur !== b[0].dapur) return a[0].dapur < b[0].dapur ? -1 : 1;
      return a[1] - b[1];
    }).map(function(x){ return x[0]; });
  }
  const hariIni = todayISO();
  const perObj = (periodesTutup || []).find(function(x){ return x.id === per; });
  const tampil = mode === 'hari' ? data.pengajuan.filter(function(h){ return h.tanggal === hariIni; })
    : mode === 'aktif' ? data.pengajuan
    : (!per ? [] : dataLalu ? dataLalu.pengajuan : null);
  const perluTindakan = data.pengajuan.filter(function(h){ return h.tanggal !== hariIni && (h.status === 'MENUNGGU' || h.status === 'REVISI'); });
  const kosong = mode === 'hari' ? 'Belum ada pengajuan dengan hari H ' + fmtDDMMYYYY(hariIni) + '.'

    : !per ? 'Pilih periode yang sudah ditutup untuk melihat pengajuannya.' : 'Tidak ada pengajuan di periode ini.';
  const dapurOptions = isAsisten ? (dapurList || []).map(function(d){ return { id: d.id, nama: d.nama, aktif: aktifKeys.indexOf(d.id) >= 0 }; }) : null;

  return <div>
    {isAkuntan && vaKeys.length === 1 && <VACard va={data.va[vaKeys[0]]}/>}

    {isAsisten && <Card className="mb-3"><div className="text-sm" style={{ color: COLORS.muted }}>Akun asisten: mengajukan <b>Bahan Baku</b> untuk semua dapur. Realisasi (transfer & bukti) dilakukan oleh akuntan masing-masing dapur.</div></Card>}

    {canCreate && !noPeriode && <div className="grid grid-cols-2 gap-2 mb-3">
      {[['buat', 'Buat pengajuan', null], ['daftar', 'Sudah diajukan', data.pengajuan.length]].map(function(t){
