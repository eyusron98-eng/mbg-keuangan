<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F4F2EC; margin: 0; }
  * { -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }

  /* Kenyamanan: fokus jelas, sentuhan responsif, animasi halus */
  input:focus, select:focus, textarea:focus { border-color: #15663E !important; box-shadow: 0 0 0 3px rgba(21,102,62,0.16); }
  button:focus-visible, a:focus-visible { outline: 2px solid #15663E; outline-offset: 2px; }
  button { transition: transform .08s ease, opacity .15s ease, background-color .15s ease; }
  button:not(:disabled):active { transform: scale(0.97); }
  button:disabled { cursor: not-allowed; }
  /* PENTING: jangan animasikan transform pada pembungkus halaman. Di Chrome, elemen dengan animasi transform
     (apalagi fill-mode both) menjadi containing block bagi position:fixed, sehingga modal/overlay ikut kotak halaman
     (modal muncul jauh di bawah atau terpotong di atas layar). Halaman cukup memudar (opacity). */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  main > div { animation: fadeIn .2s ease; }
  .sheet { animation: sheetUp .2s ease; }   /* tanpa fill-mode: setelah selesai tidak ada transform yang tertinggal (modal bertumpuk tetap benar) */
  @media (pointer: coarse) { button { min-height: 40px; } }
  /* main tidak boleh jadi scroll-container, kalau tidak position:sticky di dalamnya tidak berfungsi */
  .app-main { min-width: 0; overflow-x: hidden; }
  @supports (overflow: clip) { .app-main { overflow-x: clip; } }
  /* Bar aksi yang selalu terlihat di bawah layar (di atas navigasi bawah pada HP) */
  .sticky-bar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); z-index: 20; background: #fff;
    margin: 14px -16px -16px; padding: 12px 16px; border-top: 1px solid #E3E0D6; border-radius: 0 0 16px 16px; box-shadow: 0 -8px 14px rgba(23,42,31,0.07); }
  @media (min-width: 640px) { .sticky-bar { margin: 14px -20px -20px; padding: 12px 20px; } }
  @media (min-width: 768px) { .sticky-bar { bottom: 0; } }
  /* 16px mencegah iOS memperbesar layar sendiri saat mengetik */
  @media (max-width: 640px) {
    input:not([type=checkbox]):not([type=file]), select, textarea { font-size: 16px !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  #loading-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #F4F2EC; z-index: 9999; flex-direction: column; gap: 16px; }
  #loading-screen .sp { width: 36px; height: 36px; border: 3px solid #E3E0D6; border-top-color: #15663E; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-banner { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; background: #B7472E; color: white; font-size: 13px; z-index: 10000; display: none; white-space: pre-wrap; line-height: 1.5; font-family: ui-monospace, monospace; }

  @media print {
    body { background: white; }
    .no-print { display: none !important; }
    .print-container { padding: 0 !important; box-shadow: none !important; border: none !important; }
    @page { size: A4; margin: 1.5cm 1.2cm; }
    table { page-break-inside: avoid; }

    .lampiran-img { max-width: 100%; max-height: 18cm; page-break-inside: avoid; }
  }
</style>

<div id="error-banner"></div>
<div id="loading-screen"><div class="sp"></div><div style="color:#6E7B70;font-size:14px;">Memuat Keuangan MBG…</div></div>
<div id="root"></div>

<script>
  function showError(msg, src) {
    var b = document.getElementById('error-banner');
    if (!b) return;
    b.style.display = 'block';
    b.innerHTML = '<b>⚠️ Error</b><br>' + (src ? '<i>' + src + '</i><br>' : '') + String(msg) + '<br><br>Coba <b>Ctrl+Shift+R</b>.';
    var ls = document.getElementById('loading-screen'); if (ls) ls.style.display = 'none';
  }
  window.addEventListener('error', function(e) { showError((e.message || 'Unknown') + '\n' + (e.filename || ''), 'window.onerror'); });
  setTimeout(function() {
    var root = document.getElementById('root');
    if (root && root.children.length === 0) showError('React tidak ter-render dalam 15 detik.', 'timeout');
  }, 15000);
</script>

// Token sesi dikirim otomatis; kalau server bilang sesi tidak valid → paksa login ulang
let AUTH_TOKEN = null;
let ON_SESSION_INVALID = null;
const isSesiErr = j => !!(j && j.ok === false && /Sesi tidak valid/.test(j.error || ''));
function checkSession(j, tokenDipakai) {
  // Hanya keluarkan pengguna bila token yang ditolak = token yang sedang dipakai
  // (balasan telat dari sesi lama tidak boleh menendang sesi baru).
  if (isSesiErr(j) && tokenDipakai === AUTH_TOKEN && ON_SESSION_INVALID) ON_SESSION_INVALID(j.error);
  return j;
}
// Server kadang belum "melihat" sesi yang baru dibuat → coba sekali lagi sebelum menyerah.
// Aman diulang: permintaan yang ditolak karena sesi tidak diproses sama sekali oleh server.
async function kirimDenganSesi(kirim) {
  const tok = AUTH_TOKEN;
  let j = await kirim(tok);
  if (isSesiErr(j) && tok && tok === AUTH_TOKEN) {
    await new Promise(function(r){ setTimeout(r, 1500); });
    if (tok === AUTH_TOKEN) j = await kirim(tok);
  }
  return checkSession(j, tok);
}
async function api(action, params) {
  params = params || {};
  return kirimDenganSesi(async function(tok) {
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    if (tok && !params.token) url.searchParams.set('token', tok);
    Object.keys(params).forEach(function(k) {
      if (params[k] !== undefined && params[k] !== null) {
        url.searchParams.set(k, typeof params[k] === 'object' ? JSON.stringify(params[k]) : String(params[k]));
      }
    });
    try { const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' }); return await res.json(); }
    catch (e) { return { ok: false, error: 'Koneksi gagal: ' + e.message }; }
  });
}
// POST untuk payload besar (tabel pengajuan, keputusan)
async function apiPost(action, params) {
  return kirimDenganSesi(async function(tok) {
    try {
      const res = await fetch(API_URL, { method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action, token: tok }, params)) });
      return await res.json();
    } catch (e) { return { ok: false, error: 'Koneksi gagal: ' + e.message }; }
  });
}
async function apiUpload(action, params) {

// Build ledger rows: Saldo Awal + VA Topups + Transaksi (sorted by date)
// mode: 'aktual' uses riil, 'anggaran' uses unriil
// Urut kronologis: hari (tanggal) naik, lalu urutan pencatatan (seq) naik.
// Yang dicatat lebih dulu ada di atas. Top-up VA diprioritaskan di awal hari.
function sortEventsChrono(events) {
  events.sort((a, b) => {
    if (a._ts !== b._ts) return a._ts - b._ts;
    if (a._grp !== b._grp) return a._grp - b._grp;   // top-up (0) sebelum transaksi (1)
    return a._seq - b._seq;                           // urutan input (seq naik)
  });
}

function buildLedger(saldoAwalVA, saldoAwalPetty, vaTopups, transaksi, mode) {
  const events = [];
  vaTopups.forEach((t, i) => events.push({ tanggal: t.tanggal, type: 'topup_va', amount: t.jumlah, ket: t.keterangan, _ts: new Date(t.tanggal).getTime(), _grp: 0, _seq: (t.seq != null ? t.seq : i) }));
  transaksi.forEach((t, i) => events.push({ tanggal: t.tanggal, type: 'transaksi', tx: t, amount: mode === 'anggaran' ? t.unriil : t.riil, _ts: new Date(t.tanggal).getTime(), _grp: 1, _seq: (t.seq != null ? t.seq : i) }));
  sortEventsChrono(events);

  const saldoAwal = (saldoAwalVA || 0) + (saldoAwalPetty || 0);
  let running = saldoAwal;
  const rows = [];
  rows.push({ kind: 'awal', bulan: '-', tanggal: '-', no_bukti: '-', uraian: 'Saldo Awal Periode', debit: saldoAwal, kredit: 0, saldo: running });
  events.forEach(ev => {
    if (ev.type === 'topup_va') {
      running += ev.amount;
      rows.push({ kind: 'topup', bulan: getBulan(ev.tanggal), tanggal: ev.tanggal, no_bukti: '-',
        uraian: 'Top-up Saldo VA' + (ev.ket ? ' — ' + ev.ket : ''), debit: ev.amount, kredit: 0, saldo: running });
    } else {
      running -= ev.amount;
      rows.push({ kind: 'tx', bulan: getBulan(ev.tanggal), tanggal: ev.tanggal, no_bukti: ev.tx.no_bukti || '-',
        uraian: ev.tx.uraian, debit: 0, kredit: ev.amount, saldo: running,
        tx: ev.tx });
    }
  });
  return rows;
}

// Dual-mode ledger: 1 baris, 2 kolom Kredit (Aktual & Anggaran), 2 kolom Saldo
function buildDualLedger(saldoAwalVA, saldoAwalPetty, vaTopups, transaksi) {
  const events = [];
  vaTopups.forEach((t, i) => events.push({ tanggal: t.tanggal, type: 'topup_va', amount: t.jumlah, ket: t.keterangan, _ts: new Date(t.tanggal).getTime(), _grp: 0, _seq: (t.seq != null ? t.seq : i) }));
  transaksi.forEach((t, i) => events.push({ tanggal: t.tanggal, type: 'transaksi', tx: t, aktual: t.riil, anggaran: t.unriil, _ts: new Date(t.tanggal).getTime(), _grp: 1, _seq: (t.seq != null ? t.seq : i) }));
  sortEventsChrono(events);

  const saldoAwal = (saldoAwalVA || 0) + (saldoAwalPetty || 0);
  let runAktual = saldoAwal, runAnggaran = saldoAwal;
  const rows = [];
  rows.push({ kind: 'awal', bulan: '-', tanggal: '-', no_bukti: '-', uraian: 'Saldo Awal Periode',
    debit: saldoAwal, kreditAktual: 0, kreditAnggaran: 0, saldoAktual: runAktual, saldoAnggaran: runAnggaran });
  events.forEach(ev => {
    if (ev.type === 'topup_va') {
      runAktual += ev.amount; runAnggaran += ev.amount;
      rows.push({ kind: 'topup', bulan: getBulan(ev.tanggal), tanggal: ev.tanggal, no_bukti: '-',
        uraian: 'Top-up Saldo VA' + (ev.ket ? ' — ' + ev.ket : ''),
        debit: ev.amount, kreditAktual: 0, kreditAnggaran: 0,
        saldoAktual: runAktual, saldoAnggaran: runAnggaran });
    } else {
      runAktual -= ev.aktual; runAnggaran -= ev.anggaran;
      rows.push({ kind: 'tx', bulan: getBulan(ev.tanggal), tanggal: ev.tanggal, no_bukti: ev.tx.no_bukti || '-',
        uraian: ev.tx.uraian, debit: 0,
        kreditAktual: ev.aktual, kreditAnggaran: ev.anggaran,
        saldoAktual: runAktual, saldoAnggaran: runAnggaran, tx: ev.tx });
    }
  });
  return rows;
}

function Btn(p) {

    : kind === 'blue' ? { background: COLORS.blue, color: '#fff' }

  const sizePad = p.size === 'sm' ? 'px-3 py-2 text-xs' : 'px-4 py-2.5 text-sm';
  return <button type={p.type||'button'} onClick={p.onClick} disabled={p.disabled} title={p.title}
    style={Object.assign({}, sty, { opacity: p.disabled ? 0.6 : 1, width: p.full ? '100%' : 'auto', minHeight: p.size === 'sm' ? 36 : 44 })}

function Field(p) {

    {p.children}

// ---------- Sinkron saldo antar periode ----------
// Saldo akhir aktual (riil = uang yang benar-benar keluar) periode lalu dihitung ulang dari transaksinya,
// jadi perubahan di periode tertutup yang disetujui admin otomatis terbaca sebagai selisih terhadap saldo awal periode berikutnya.
function hitungSaldoAkhir(p, vaTopups, pettyTopups, tx) {
  const sum = function(a, f){ return a.reduce(function(s, x){ return s + (Number(f(x)) || 0); }, 0); };
  const va = vaTopups.filter(function(t){ return t.periode_id === p.id; });
  const pc = pettyTopups.filter(function(t){ return t.periode_id === p.id; });
  const keluarPetty = sum(tx.filter(function(t){ return t.sumber === 'Petty Cash'; }), function(t){ return t.riil; });
  const keluarVA = sum(tx.filter(function(t){ return t.sumber !== 'Petty Cash'; }), function(t){ return t.riil; });
  const topupPetty = sum(pc, function(t){ return t.jumlah; });
  return {
    va: Number(p.saldoVA || 0) + sum(va, function(t){ return t.jumlah; }) - topupPetty - keluarVA,
    petty: Number(p.saldoPettyAwal || 0) + topupPetty - keluarPetty,
  };
}
async function fetchSaldoSync(session) {
  const dapur = session.user.dapur;
  const [pl, va, pc] = await Promise.all([
    api('getPeriodeList', { role: session.user.role, dapur: dapur, scope: dapur }),
    api('getVATopups', { dapur: dapur }),
    api('getPettyTopups', { dapur: dapur }),
  ]);
  if (!pl.ok || !va.ok || !pc.ok) return null;
  const aktif = pl.data.find(function(p){ return p.status === 'AKTIF'; }) || null;
  const prev = pl.data.filter(function(p){ return p.status !== 'AKTIF' && (!aktif || p.periode_no < aktif.periode_no); })
    .sort(function(a, b){ return b.periode_no - a.periode_no; })[0];
  if (!prev) return null;
  const tx = await api('getTransaksi', { role: session.user.role, dapur: dapur || '', scope: dapur, periode_id: prev.id });
  if (!tx.ok) return null;
  const akhir = hitungSaldoAkhir(prev, va.data, pc.data, tx.data);
  const awal = aktif ? { va: Number(aktif.saldoVA || 0), petty: Number(aktif.saldoPettyAwal || 0) } : null;
  return { aktif: aktif, prev: prev, akhir: akhir, awal: awal,
    selisihVA: awal ? awal.va - akhir.va : 0, selisihPetty: awal ? awal.petty - akhir.petty : 0 };
}
function syncKey(s) { return 'mbg_sync_ack:' + s.aktif.id + ':' + s.selisihVA + ':' + s.selisihPetty; }

      <tbody>
        <tr><td className="px-2 py-1.5" style={{ color: COLORS.muted }}>Saldo akhir Periode {sync.prev.periode_no}</td>{cell(sync.akhir.va)}{cell(sync.akhir.petty)}</tr>
        <tr style={{ borderTop: '1px solid ' + COLORS.line }}><td className="px-2 py-1.5" style={{ color: COLORS.muted }}>Saldo awal Periode {sync.aktif.periode_no}</td>{cell(sync.awal.va)}{cell(sync.awal.petty)}</tr>
        <tr style={{ borderTop: '1px solid ' + COLORS.line }}><td className="px-2 py-1.5 font-semibold" style={{ color: COLORS.ink }}>Selisih</td>{cell(sync.selisihVA, sync.selisihVA !== 0)}{cell(sync.selisihPetty, sync.selisihPetty !== 0)}</tr>
      </tbody>
    </table></div>
    {sama
      ? <div className="text-xs mt-2 rounded-lg p-2.5" style={{ background: '#E8F1EC', color: COLORS.green }}>✓ Saldo awal periode ini nyambung dengan saldo akhir periode sebelumnya.</div>
      : <div className="text-xs mt-2 rounded-lg p-2.5" style={{ background: '#FBF3E2', color: '#9A6A0B' }}>
          Saldo awal tidak sama dengan saldo akhir periode lalu. Ini wajar bila ada <b>penambahan kas di pergantian periode</b>. Bila penyebabnya perubahan transaksi periode lalu (mis. edit yang baru disetujui admin), samakan saldo awal. Perubahan saldo awal wajib disertai alasan dan tercatat di log.
          <div className="mt-2"><Btn size="sm" kind="amber" onClick={onSamakan}>Samakan dengan saldo akhir Periode {sync.prev.periode_no}</Btn></div>
        </div>}
  </Card>;
}

function SaldoSyncBanner({ session, onGoSetup }) {
  const [sync, setSync] = useState(null);
  const [, bump] = useState(0);
  useEffect(function() {
    let live = true;
    fetchSaldoSync(session).then(function(s){ if (live) setSync(s); });
    return function() { live = false; };
  }, []);
  if (!sync || !sync.aktif || (sync.selisihVA === 0 && sync.selisihPetty === 0)) return null;
  let acked = false; try { acked = !!localStorage.getItem(syncKey(sync)); } catch (e) {}
  if (acked) return null;
  function abaikan() { try { localStorage.setItem(syncKey(sync), '1'); } catch (e) {} bump(function(n){ return n + 1; }); }
  return <Card className="mb-3">
    <div className="flex items-start gap-2.5">
      <span style={{ color: COLORS.amber }}>{I.warn}</span>
      <div className="flex-1 min-w-0">
        <div className="text-sm font-semibold" style={{ color: COLORS.ink }}>Saldo awal Periode {sync.aktif.periode_no} tidak sama dengan saldo akhir Periode {sync.prev.periode_no}</div>
        <div className="text-xs mt-0.5" style={{ color: COLORS.muted }}>Selisih VA {fmt(sync.selisihVA)}{sync.selisihPetty !== 0 ? ' · Petty ' + fmt(sync.selisihPetty) : ''}. Bisa sah (penambahan kas) atau akibat perubahan transaksi periode lalu.</div>
        <div className="flex gap-2 mt-2"><Btn size="sm" onClick={onGoSetup}>Periksa di Setup</Btn><Btn size="sm" kind="ghost" onClick={abaikan}>Sudah sesuai</Btn></div>
      </div>
    </div>
  </Card>;
}

function PeriodeForm({ initial, carry, prefill, onClose, onSaved, session, toast }) {
  const [f, setF] = useState(function() {
    const base = Object.assign({ alasan: '' }, initial || { tanggal_mulai: '', tanggal_akhir: '', penerima: '',
      saldoVA: carry ? String(Math.max(0, carry.va)) : '', saldoPettyAwal: carry ? String(Math.max(0, carry.petty)) : '' }, prefill || {});
    base.saldoVA = base.saldoVA === '' || base.saldoVA == null ? '' : String(Math.max(0, Number(base.saldoVA) || 0));
    base.saldoPettyAwal = base.saldoPettyAwal === '' || base.saldoPettyAwal == null ? '' : String(Math.max(0, Number(base.saldoPettyAwal) || 0));
    return base;
  });
  const [saving, setSaving] = useState(false);
  const isEdit = !!initial && !!initial.id;
  const saldoBerubah = isEdit && (Number(f.saldoVA || 0) !== Number(initial.saldoVA || 0) || Number(f.saldoPettyAwal || 0) !== Number(initial.saldoPettyAwal || 0));
  const bedaCarry = !isEdit && !!carry && (Number(f.saldoVA || 0) !== carry.va || Number(f.saldoPettyAwal || 0) !== carry.petty);
  const perluAlasan = saldoBerubah || bedaCarry;
  function set(k, v) { setF(function(p){ const n = Object.assign({}, p); n[k] = v; return n; }); }
  async function submit() {
    if (!f.tanggal_mulai || !f.tanggal_akhir) { toast('Isi tanggal mulai & akhir', 'error'); return; }
    if (f.tanggal_mulai >= f.tanggal_akhir) { toast('Tanggal mulai harus sebelum tanggal akhir', 'error'); return; }
    if (perluAlasan && !String(f.alasan || '').trim()) { toast('Isi alasan saldo awal', 'error'); return; }
    setSaving(true);
    const action = isEdit ? 'updatePeriode' : 'addPeriode';
    const payload = Object.assign({ role: session.user.role, user_id: session.user.id, dapur: session.user.dapur,
      tanggal_mulai: f.tanggal_mulai, tanggal_akhir: f.tanggal_akhir,
      penerima: f.penerima, saldoVA: f.saldoVA, saldoPettyAwal: f.saldoPettyAwal, alasan: f.alasan },
      isEdit ? { id: initial.id } : {});
    const res = await api(action, payload);
    setSaving(false);
    if (res.ok) { toast(isEdit ? 'Periode diupdate' : 'Periode dibuat'); onSaved(); onClose(); }
    else toast(res.error || 'Gagal menyimpan', 'error');
  }
  return (
    <Modal title={isEdit ? ('Edit Periode ' + initial.periode_no) : 'Buat Periode Baru'} onClose={onClose}>
      <Field label="Tanggal mulai"><input type="date" value={f.tanggal_mulai} onChange={function(e){set('tanggal_mulai', e.target.value);}} style={inputStyle}/></Field>
      <Field label="Tanggal akhir"><input type="date" value={f.tanggal_akhir} onChange={function(e){set('tanggal_akhir', e.target.value);}} style={inputStyle}/></Field>
      <Field label="Jumlah penerima manfaat" hint="porsi/hari"><input type="number" value={f.penerima} onChange={function(e){set('penerima', e.target.value);}} style={inputStyle} placeholder="0"/></Field>
      {carry && <div className="mb-3 rounded-lg p-3 text-xs" style={{ background: COLORS.paper, color: COLORS.muted }}>
        Saldo akhir Periode {carry.no}: VA <b className="num" style={{ color: COLORS.ink }}>{fmt(carry.va)}</b> · Petty <b className="num" style={{ color: COLORS.ink }}>{fmt(carry.petty)}</b>
        {isEdit
          ? <div className="mt-1.5"><button type="button" className="font-semibold" style={{ color: COLORS.blue }} onClick={function(){ set('saldoVA', String(Math.max(0, carry.va))); set('saldoPettyAwal', String(Math.max(0, carry.petty))); }}>Pakai saldo akhir ini</button></div>
          : <div className="mt-1">Terisi otomatis. Ubah bila ada penambahan kas di pergantian periode — wajib isi alasan.</div>}
      </div>}
      <Field label="Saldo VA awal" hint={isEdit ? 'Saldo VA saat periode dimulai. Perubahan tercatat di log beserta alasannya.' : null}><RupiahInput value={f.saldoVA} onChange={function(v){set('saldoVA', v);}}/></Field>
      <Field label="Saldo Petty Cash awal" hint="Boleh 0. Petty Cash akan diisi via Top-up (diambil dari saldo VA)."><RupiahInput value={f.saldoPettyAwal} onChange={function(v){set('saldoPettyAwal', v);}}/></Field>
      {perluAlasan && <Field label={isEdit ? 'Alasan perubahan saldo awal *' : 'Alasan saldo awal berbeda dari saldo akhir periode lalu *'}
        hint={isEdit ? 'VA: ' + fmt(initial.saldoVA) + ' → ' + fmt(Number(f.saldoVA || 0)) + ' · Petty: ' + fmt(initial.saldoPettyAwal) + ' → ' + fmt(Number(f.saldoPettyAwal || 0))
          : carry ? 'Selisih VA ' + fmt(Number(f.saldoVA || 0) - carry.va) + ' · Petty ' + fmt(Number(f.saldoPettyAwal || 0) - carry.petty) : null}>
        <input value={f.alasan} onChange={function(e){set('alasan', e.target.value);}} style={inputStyle} placeholder="cth. penambahan kas dari yayasan 1 Nov, sesuai rekening koran"/></Field>}
      <div className="flex gap-2"><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={submit} disabled={saving}>{saving ? I.spinner : I.check} Simpan</Btn></div>
    </Modal>
  );
}

function TopupForm({ tipe, periode, onClose, onSaved, session, toast }) {
  const [f, setF] = useState({ tanggal: todayISO(), jumlah: '', keterangan: '' });
  const [saving, setSaving] = useState(false);
  function set(k, v) { setF(function(p){ const n = Object.assign({}, p); n[k] = v; return n; }); }
  async function submit() {
    if (!f.tanggal || !(Number(f.jumlah) > 0)) { toast('Isi tanggal & jumlah (lebih dari 0)', 'error'); return; }
    if (tipe === 'Petty' && Number(f.jumlah) > Number(periode.sisaVA || 0)) { toast('Jumlah melebihi saldo VA tersedia (' + fmt(periode.sisaVA) + ')', 'error'); return; }
    setSaving(true);
    const action = tipe === 'VA' ? 'addVATopup' : 'addPettyTopup';
    const res = await api(action, { role: session.user.role, user_id: session.user.id, dapur: session.user.dapur,
      tanggal: f.tanggal, jumlah: f.jumlah, keterangan: f.keterangan });
    setSaving(false);
    if (res.ok) { toast('Top-up tersimpan'); onSaved(); onClose(); }
    else toast(res.error || 'Gagal menyimpan', 'error');
  }
  const label = tipe === 'VA' ? 'Saldo VA' : 'Saldo Petty Cash';
  const isPetty = tipe === 'Petty';
  return (
    <Modal title={'Top-up ' + label} onClose={onClose}>
      <div className="mb-3 p-3 rounded-lg text-xs" style={{ background: COLORS.paper, color: COLORS.muted }}>
        Periode {periode.periode_no} · {fmtDateRange(periode.tanggal_mulai, periode.tanggal_akhir)}<br/>
        <span style={{ color: COLORS.ink }}>Saldo VA tersedia: <b>{fmt(periode.sisaVA)}</b></span>
        {isPetty && <><br/><span style={{ color: COLORS.amber }}>⚠️ Top-up Petty akan mengurangi saldo VA</span></>}
      </div>
      <Field label="Tanggal terima"><input type="date" value={f.tanggal} min={periode.tanggal_mulai} max={periode.tanggal_akhir} onChange={function(e){set('tanggal', e.target.value);}} style={inputStyle}/></Field>
      <Field label="Jumlah" hint={isPetty ? 'Maks Rp ' + new Intl.NumberFormat('id-ID').format(periode.sisaVA) : null}>
        <RupiahInput value={f.jumlah} onChange={function(v){set('jumlah', v);}}/>
      </Field>
      <Field label="Keterangan" hint={tipe==='VA' ? 'cth. Transfer dari yayasan' : 'cth. Tarik tunai untuk kas operasional'}>
        <input value={f.keterangan} onChange={function(e){set('keterangan', e.target.value);}} style={inputStyle}/>
      </Field>
      <div className="flex gap-2"><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={submit} disabled={saving}>{saving ? I.spinner : I.check} Simpan</Btn></div>
    </Modal>
  );
}

function SaldoCard({ tipe, periode, topups, onTopup, color, onEditAwal }) {
  const isVA = tipe === 'VA';
  const awal = isVA ? periode.saldoVA : periode.saldoPettyAwal;
  const topupTotal = isVA ? periode.totalVATopup : periode.totalPettyTopup;
  const pengeluaran = isVA ? periode.pengeluaranVA : periode.pengeluaranPetty;
  const sisa = isVA ? periode.sisaVA : periode.sisaPetty;
  const denom = isVA ? (awal + topupTotal) : (awal + topupTotal);
  const used = isVA ? (pengeluaran + periode.totalPettyTopup) : pengeluaran;
  const usedPct = denom > 0 ? Math.min(100, (used / denom) * 100) : 0;
  return (
    <Card>
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">
          <div className="rounded-lg flex items-center justify-center" style={{ width: 32, height: 32, background: COLORS.paper, color: color }}>
            {isVA ? I.wallet : I.cash}
          </div>
          <div className="font-bold text-sm" style={{ color: COLORS.ink }}>Saldo {isVA ? 'VA' : 'Petty Cash'}</div>
        </div>
        <Btn kind={isVA ? 'blue' : 'amber'} size="sm" onClick={onTopup}>{I.plusSm} Top-up</Btn>
      </div>

      <div className="grid grid-cols-2 gap-2 mb-3 text-xs">
        <div className="rounded p-2" style={{ background: COLORS.paper }}>
          <div className="flex items-center justify-between"><span style={{ color: COLORS.muted }}>Saldo Awal</span>
            {onEditAwal && <button onClick={onEditAwal} className="text-[11px] font-semibold" style={{ color: COLORS.blue }}>Ubah</button>}</div>
          <div className="font-semibold num" style={{ color: COLORS.ink }}>{fmt(awal)}</div>
        </div>
        <div className="rounded p-2" style={{ background: COLORS.paper }}>
          <div style={{ color: COLORS.muted }}>Top-up ({topups.length})</div>
          <div className="font-semibold num" style={{ color: COLORS.ink }}>+ {fmt(topupTotal)}</div>
        </div>
        <div className="rounded p-2" style={{ background: COLORS.paper }}>
          <div style={{ color: COLORS.muted }}>{isVA ? 'Keluar (pengeluaran + ke Petty)' : 'Pengeluaran'}</div>
          <div className="font-semibold num" style={{ color: COLORS.danger }}>− {fmt(used)}</div>
        </div>
        <div className="rounded p-2" style={{ background: '#E8F1EC' }}>
          <div style={{ color: COLORS.muted }}>Saldo Sekarang</div>
          <div className="font-bold num" style={{ color: color }}>{fmt(sisa)}</div>
        </div>
      </div>

      <div className="h-1.5 rounded-full overflow-hidden mb-1" style={{ background: COLORS.paper }}>
        <div style={{ width: usedPct + '%', height: '100%', background: color }}/>
      </div>
      <div className="text-[11px]" style={{ color: COLORS.muted }}>Terpakai {usedPct.toFixed(1)}% dari {fmt(denom)}</div>

      {topups.length > 0 && (
        <div className="mt-3 pt-3 border-t" style={{ borderColor: COLORS.line }}>
          <div className="text-xs font-semibold mb-2" style={{ color: COLORS.muted }}>Riwayat Top-up</div>
          <div className="space-y-1">
            {topups.slice(0, 5).map(function(t){
              return <div key={t.id} className="flex items-center justify-between text-xs">
                <div>
                  <span style={{ color: COLORS.ink }}>{fmtDate(t.tanggal)}</span>
                  {t.keterangan && <span style={{ color: COLORS.muted }}> · {t.keterangan}</span>}
                </div>
                <span className="font-medium num" style={{ color: color }}>+ {fmt(t.jumlah)}</span>
              </div>;
            })}
            {topups.length > 5 && <div className="text-xs" style={{ color: COLORS.muted }}>+ {topups.length - 5} lainnya</div>}
          </div>
        </div>
      )}
    </Card>
  );
}

function SetupPeriode({ session, toast }) {
  const [periode, setPeriode] = useState(null);
  const [list, setList] = useState([]);
  const [vaTopups, setVaTopups] = useState([]);
  const [pettyTopups, setPettyTopups] = useState([]);
  const [loading, setLoading] = useState(true);
  const [openForm, setOpenForm] = useState(false);
  const [editPeriode, setEditPeriode] = useState(null);
  const [openTopup, setOpenTopup] = useState(null);
  const [confirmClose, setConfirmClose] = useState(null);
  const [sync, setSync] = useState(null);
  const [prefill, setPrefill] = useState(null);

  const load = useCallback(async function() {
    setLoading(true);
    const [act, pl, va, pc] = await Promise.all([
      api('getActivePeriode', { dapur: session.user.dapur }),
      api('getPeriodeList', { role: session.user.role, dapur: session.user.dapur, scope: session.user.dapur }),
      api('getVATopups', { dapur: session.user.dapur }),
      api('getPettyTopups', { dapur: session.user.dapur }),
    ]);
    setLoading(false);
    if (act.ok) setPeriode(act.data);
    if (pl.ok) setList(pl.data);
    if (va.ok) setVaTopups(va.data);
    if (pc.ok) setPettyTopups(pc.data);
    fetchSaldoSync(session).then(setSync);   // tidak memblokir tampilan Setup
  }, []);
  useEffect(function() { load(); }, [load]);

  if (loading) return <Card>{I.spinner}</Card>;

  const closed = list.filter(p => p.status !== 'AKTIF').sort((a,b)=>b.periode_no-a.periode_no);
  const aktifVATopups = periode ? vaTopups.filter(t => t.periode_id === periode.id) : [];
  const aktifPettyTopups = periode ? pettyTopups.filter(t => t.periode_id === periode.id) : [];
  const carry = sync ? { va: sync.akhir.va, petty: sync.akhir.petty, no: sync.prev.periode_no } : null;
  function openEdit(pre) {
    setEditPeriode({ id: periode.id, periode_no: periode.periode_no,
      tanggal_mulai: periode.tanggal_mulai, tanggal_akhir: periode.tanggal_akhir,
      penerima: periode.penerima, saldoVA: periode.saldoVA, saldoPettyAwal: periode.saldoPettyAwal });
    setPrefill(pre || null);
    setOpenForm(true);
  }

  async function doClose() {
    const res = await api('closePeriode', { role: session.user.role, user_id: session.user.id, id: confirmClose.id });
    if (res.ok) { toast('Periode ditutup'); setConfirmClose(null); load(); }
    else toast(res.error, 'error');
  }

  return (
    <div>
      {session.user.role === 'akuntan' && <IdentitasDapurCard session={session} toast={toast}/>}
      <Card className="mb-3">
        <Eyebrow>Periode Aktif</Eyebrow>
        {!periode ? (
          <div className="text-center py-6">
            <div className="mb-3 flex justify-center" style={{ color: COLORS.muted }}>{I.warn}</div>
            <div className="text-sm font-medium" style={{ color: COLORS.ink }}>Belum ada periode aktif</div>
            <div className="text-xs mb-4" style={{ color: COLORS.muted }}>Transaksi tidak bisa diinput sampai periode dibuat.</div>
            {session.user.role === 'akuntan' && (
              <Btn onClick={function(){setEditPeriode(null); setOpenForm(true);}}>{I.plusSm} Buat Periode Baru</Btn>
            )}
          </div>
        ) : (
          <div>
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-3">
              <div>
                <div className="text-lg font-bold" style={{ color: COLORS.ink }}>Periode {periode.periode_no}</div>
                <div className="text-sm" style={{ color: COLORS.muted }}>{fmtDateRange(periode.tanggal_mulai, periode.tanggal_akhir)}</div>
              </div>
              <PeriodeBadge status="AKTIF"/>
            </div>
            <div className="rounded-lg p-3 mb-3" style={{ background: COLORS.paper }}>
              <div className="text-xs" style={{ color: COLORS.muted }}>Penerima Manfaat</div>
              <div className="font-bold num" style={{ color: COLORS.ink }}>{new Intl.NumberFormat('id-ID').format(periode.penerima)} porsi/hari</div>
            </div>

            {session.user.role === 'akuntan' && (
              <div className="flex flex-wrap gap-2 mt-3">
                <Btn kind="ghost" onClick={function(){ openEdit(null); }}>{I.edit} Edit Periode</Btn>
                <Btn kind="danger" onClick={function(){setConfirmClose(periode);}}>{I.lock} Tutup Periode</Btn>
              </div>
            )}
          </div>
        )}
      </Card>

      {periode && (
        <div className="grid lg:grid-cols-2 gap-3 mb-3">
          <SaldoCard tipe="VA" periode={periode} topups={aktifVATopups}
            onTopup={function(){setOpenTopup('VA');}} color={COLORS.blue}
            onEditAwal={session.user.role === 'akuntan' ? function(){ openEdit(null); } : null}/>
          <SaldoCard tipe="Petty" periode={periode} topups={aktifPettyTopups}
            onTopup={function(){setOpenTopup('Petty');}} color={COLORS.amber}/>
        </div>
      )}

      {periode && session.user.role === 'akuntan' && <SaldoSyncCard sync={sync} onSamakan={function(){
        openEdit({ saldoVA: Math.max(0, sync.akhir.va), saldoPettyAwal: Math.max(0, sync.akhir.petty) }); }}/>}

      {closed.length > 0 && (
        <Card className="mb-3">
          <Eyebrow>Riwayat Periode ({closed.length} ditutup)</Eyebrow>
          <div className="space-y-2 mt-2">
            {closed.map(function(p){
              return <div key={p.id} className="flex items-center justify-between rounded-lg p-3" style={{ background: COLORS.paper }}>
                <div>
                  <div className="text-sm font-medium" style={{ color: COLORS.ink }}>Periode {p.periode_no}</div>
                  <div className="text-xs" style={{ color: COLORS.muted }}>{fmtDateRange(p.tanggal_mulai, p.tanggal_akhir)}</div>
                </div>
                <PeriodeBadge status={p.status}/>
              </div>;
            })}
          </div>
        </Card>
      )}

      {openForm && (
        <PeriodeForm initial={editPeriode} carry={carry} prefill={prefill} onClose={function(){setOpenForm(false); setEditPeriode(null); setPrefill(null);}}
          onSaved={load} session={session} toast={toast}/>
      )}
      {openTopup && periode && (
        <TopupForm tipe={openTopup} periode={periode}
          onClose={function(){setOpenTopup(null);}} onSaved={load} session={session} toast={toast}/>
      )}
      {confirmClose && (
        <ConfirmModal title="Tutup Periode"
          message={'Akan menutup Periode ' + confirmClose.periode_no + ' (' + fmtDateRange(confirmClose.tanggal_mulai, confirmClose.tanggal_akhir) + '). Setelah ditutup, tidak bisa edit/hapus transaksi, top-up, atau ubah periode. Lanjutkan?'}
          onConfirm={doClose} onClose={function(){setConfirmClose(null);}} confirmLabel="Ya, Tutup" danger/>
      )}
    </div>
  );
}

              </div>
            </div>
          </div>
          {cats.length === 0 ? <p className="text-sm text-center py-4" style={{ color: COLORS.muted }}>Belum ada transaksi.</p> : (

                </thead>
                <tbody>
                  {cats.map(function(c, i){
                    const pct = subAktual > 0 ? (c.riil / subAktual * 100) : 0;
                    return <tr key={c.name} style={{ borderTop: '1px solid ' + COLORS.line }}>
                      <td className="px-3 py-2" style={{ color: COLORS.ink }}>{c.name}</td>
                      <td className="px-3 py-2 text-right font-medium num" style={{ color: COLORS.green }}>{fmt(c.riil)}</td>
                      {hasAnggaran && <td className="px-3 py-2 text-right font-medium num" style={{ color: COLORS.amber }}>{fmt(c.unriil)}</td>}
                      <td className="px-3 py-2">
                        <div className="flex items-center gap-2">
                          <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{ background: COLORS.paper }}>
                            <div style={{ width: pct + '%', height: '100%', background: CAT_COLORS[i % CAT_COLORS.length] }}/>
                          </div>
                          <span className="text-xs num" style={{ color: COLORS.muted, minWidth: 36 }}>{pct.toFixed(0)}%</span>
                        </div>
                      </td>
                    </tr>;
                  })}
                </tbody>
              </table>
            </div>
          )}
        </Card>;
      })}

      {!noActive && data.byDay.length > 0 && <GrafikHarian data={data.byDay}/>}
    </div>
  );
}

function TransaksiForm({ mode, initial, jenis, kategoriMap, periode, session, toast, onSubmit, submitting }) {
  // mode: 'add' or 'edit'. initial used for edit.
  const today = todayISO();
  const defaultTgl = periode ? (today >= periode.tanggal_mulai && today <= periode.tanggal_akhir ? today : periode.tanggal_mulai) : today;
  const [form, setForm] = useState(initial || {
    tanggal: defaultTgl, no_bukti: '', sumber: 'VA', uraian: '', kategori: '', riil: '', unriil: '',
  });
  const [bukti, setBukti] = useState(null);

  function set(k, v) { setForm(function(f){ const n = Object.assign({}, f); n[k] = v; return n; }); }
  const kategoriJenis = kategoriMap[jenis] || [];
  const kategoriCocok = kategoriJenis.indexOf(form.kategori) >= 0;
  // Ganti jenis (mis. di Edit Transaksi): kategori lama yang bukan milik jenis baru dikosongkan agar harus dipilih ulang
  useEffect(function() {
    if (form.kategori && kategoriJenis.length && !kategoriCocok) set('kategori', '');
  }, [jenis]);
  const isBahanBaku = jenis === 'Bahan Baku';
  const dateOutOfRange = form.tanggal && periode && (form.tanggal < periode.tanggal_mulai || form.tanggal > periode.tanggal_akhir);
  // Semua field WAJIB. Bukti wajib di mode 'add' (di 'edit' boleh kosong = pakai yang lama).
  const valid = form.tanggal && !dateOutOfRange && form.no_bukti && form.sumber &&
    form.kategori && kategoriCocok && form.uraian && form.riil &&
    (isBahanBaku || form.unriil) &&
    (mode === 'edit' || bukti) &&
    periode;

  function go() {
    if (!valid) return;
    const unrillVal = isBahanBaku ? form.riil : form.unriil;
    onSubmit({ ...form, jenis: jenis, unriil: unrillVal, bukti: bukti });
  }

  // Wrapper input untuk nominal dengan "Rp" prefix & real-time format Indonesia
  function rupiahInput(val, onChange) {
    return <div style={{ position: 'relative' }}>
      <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: COLORS.muted, fontSize: 14, pointerEvents: 'none' }}>Rp</span>
      <input type="text" inputMode="numeric" value={fmtRupiahInput(val)}
        onChange={function(e){ onChange(parseRupiahInput(e.target.value)); }}
        placeholder="0"
        style={Object.assign({}, inputStyle, { paddingLeft: 32, textAlign: 'right', fontVariantNumeric: 'tabular-nums' })}/>
    </div>;
  }

  return <div className="grid sm:grid-cols-2 gap-x-4 mt-2">
    <Field label="Tanggal transaksi *" hint={dateOutOfRange ? '⚠️ Di luar periode aktif' : null} hintColor={dateOutOfRange ? COLORS.danger : null}>
      <input type="date" value={form.tanggal} min={periode && periode.tanggal_mulai} max={periode && periode.tanggal_akhir}
        onChange={function(e){set('tanggal', e.target.value);}}
        style={Object.assign({}, inputStyle, dateOutOfRange ? { borderColor: COLORS.danger } : {})}/>
    </Field>
    <Field label="No Bukti *" hint="cth. NB-001, BKK-12, dst. — juga dipakai sebagai nama file bukti">
      <input value={form.no_bukti} onChange={function(e){set('no_bukti', e.target.value);}} style={inputStyle} placeholder="NB-001"/>
    </Field>
    <Field label="Sumber dana *">
      <div className="flex gap-2">
        {['VA','Petty Cash'].map(function(s){
          return <button key={s} onClick={function(){set('sumber', s);}} className="flex-1 rounded-lg py-2.5 text-sm font-medium"
            style={{ border: '1px solid ' + (form.sumber===s?COLORS.green:COLORS.line),
                     background: form.sumber===s?COLORS.paper:'#fff',
                     color: form.sumber===s?COLORS.green:COLORS.muted }}>{s}</button>;
        })}
      </div>
    </Field>
    <Field label="Kategori *">
      <select value={form.kategori} onChange={function(e){set('kategori', e.target.value);}} style={inputStyle}>
        <option value="">Pilih kategori…</option>
        {(kategoriMap[jenis]||[]).map(function(k){ return <option key={k} value={k}>{k}</option>; })}
      </select>
    </Field>
    <Field label="Uraian transaksi *"><input value={form.uraian} onChange={function(e){set('uraian', e.target.value);}} placeholder="cth. Ayam potong 60kg" style={inputStyle}/></Field>
    {isBahanBaku ? (
      <Field label="Nominal *" hint="Realisasi aktual">{rupiahInput(form.riil, function(v){set('riil', v);})}</Field>
    ) : (

        <Field label="Realisasi Aktual *" hint="Yang benar-benar dibayar">{rupiahInput(form.riil, function(v){set('riil', v);})}</Field>

      </Field>
      {!valid && (
        <div className="text-xs mb-3" style={{ color: COLORS.danger }}>
          {!form.tanggal ? '• Tanggal wajib diisi' : dateOutOfRange ? '• Tanggal di luar periode aktif' :
           !form.no_bukti ? '• No Bukti wajib diisi' :
           (!form.kategori || !kategoriCocok) ? '• Kategori wajib dipilih (sesuai jenis ' + jenis + ')' :
           !form.uraian ? '• Uraian wajib diisi' :
           !form.riil ? '• Nominal wajib diisi' :
           (!isBahanBaku && !form.unriil) ? '• Realisasi Anggaran wajib diisi' :
           (mode !== 'edit' && !bukti) ? '• Bukti transaksi wajib diunggah' : ''}

    </div>
  </div>;
}

function fileToBase64(file) {
  return new Promise(function(res, rej) {
    const r = new FileReader();
    r.onload = function(){ res(r.result.split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// Generate nama file bukti = "{Tanggal}_{NoBukti}.{ext}"
function buktiFileName(file, tanggal, noBukti) {
  const ext = (String(file.name).split('.').pop() || 'jpg').toLowerCase();
  const safeBukti = String(noBukti || 'tanpa-bukti').replace(/[^a-zA-Z0-9_-]+/g, '-').replace(/^-|-$/g, '');
  return tanggal + '_' + safeBukti + '.' + ext;
}

function InputTransaksi({ session, toast, onSaved, goToSetup, dapurId, alasan }) {
  const dId = dapurId || session.user.dapur;
  const [periode, setPeriode] = useState(null);
  const [loadingPeriode, setLoadingPeriode] = useState(true);
  const [kategoriMap, setKategoriMap] = useState({});
  const [step, setStep] = useState(1);
  const [jenis, setJenis] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  useEffect(function() {
    Promise.all([api('getActivePeriode', { dapur: dId }), api('getKategori')]).then(function(arr){
      setLoadingPeriode(false);
      if (arr[0].ok) setPeriode(arr[0].data);
      if (arr[1].ok) setKategoriMap(arr[1].data);
    });
  }, []);

  async function doSubmit(form) {
    setSubmitting(true);
    let bukti_url = '';
    if (form.bukti) {
      const b64 = await fileToBase64(form.bukti);
      const up = await apiUpload('uploadBukti', { fileData: b64, fileName: buktiFileName(form.bukti, form.tanggal, form.no_bukti), mimeType: form.bukti.type });
      if (up.ok) bukti_url = up.data.url;
      else { toast('Gagal upload bukti: ' + up.error, 'error'); setSubmitting(false); return; }
    }
    const res = await api('addTransaksi', {
      role: session.user.role, user_id: session.user.id, dapur: dId, alasan: alasan || '',
      tanggal: form.tanggal, no_bukti: form.no_bukti, jenis: form.jenis, kategori: form.kategori, uraian: form.uraian,
      sumber: form.sumber, riil: form.riil, unriil: form.unriil, bukti_url: bukti_url,
    });
    setSubmitting(false);
    if (res.ok) {
      toast('Transaksi tersimpan');
      setStep(1); setJenis(null);
      onSaved && onSaved();
    } else toast(res.error || 'Gagal menyimpan', 'error');
  }

  if (loadingPeriode) return <Card>{I.spinner}</Card>;
  if (!periode) {
    return (
      <Card>
        <div className="text-center py-6">
          <div className="mb-3 flex justify-center" style={{ color: COLORS.danger }}>{I.warn}</div>
          <div className="text-base font-bold mb-1" style={{ color: COLORS.ink }}>Belum ada periode aktif</div>
          <div className="text-sm mb-4" style={{ color: COLORS.muted }}>Setup periode dulu sebelum input transaksi.</div>
          {goToSetup && <Btn onClick={goToSetup}>{I.settings} Ke Setup Periode</Btn>}
        </div>
      </Card>
    );
  }

  if (step === 1) {
    return (
      <div>
        <Card className="mb-3">
          <Eyebrow>Periode aktif</Eyebrow>
          <div className="text-base font-bold" style={{ color: COLORS.ink }}>Periode {periode.periode_no}</div>
          <div className="text-sm" style={{ color: COLORS.muted }}>{fmtDateRange(periode.tanggal_mulai, periode.tanggal_akhir)}</div>
        </Card>
        <Card>
          <Eyebrow>Langkah 1 dari 2</Eyebrow>
          <h2 className="text-lg font-bold mb-1" style={{ color: COLORS.ink }}>Pilih jenis transaksi</h2>
          <p className="text-sm mb-4" style={{ color: COLORS.muted }}>Menentukan daftar kategori di langkah berikutnya.</p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            {Object.keys(kategoriMap).map(function(j){
              return <button key={j} onClick={function(){ setJenis(j); setStep(2); }}
                className="rounded-lg p-4 text-left transition hover:bg-gray-50"
                style={{ border: '1px solid ' + COLORS.line, background: '#fff' }}>
                <div className="font-semibold text-sm" style={{ color: COLORS.ink }}>{j}</div>
                <div className="text-xs mt-0.5" style={{ color: COLORS.muted }}>{kategoriMap[j].length} kategori</div>
              </button>;
            })}
          </div>
        </Card>
      </div>
    );
  }

  return (
    <div>
      <Card className="mb-3">
        <Eyebrow>Periode aktif</Eyebrow>
        <div className="text-sm font-bold" style={{ color: COLORS.ink }}>Periode {periode.periode_no} · {fmtDateRange(periode.tanggal_mulai, periode.tanggal_akhir)}</div>
      </Card>
      <Card>
        <button onClick={function(){setStep(1);}} className="inline-flex items-center gap-1.5 text-sm mb-3" style={{ color: COLORS.green }}>{I.arrowL} {jenis}</button>
        <Eyebrow>Langkah 2 dari 2 · Detail transaksi</Eyebrow>
        <TransaksiForm mode="add" jenis={jenis} kategoriMap={kategoriMap} periode={periode}
          session={session} toast={toast} onSubmit={doSubmit} submitting={submitting}/>
      </Card>
    </div>
  );
}

// ============================================================
//  LAPORAN — Format Ledger (Bulan|Tgl|NoBukti|Uraian|Debit|Kredit|Saldo)
//  Mode: anggaran (untuk yayasan, pakai unriil)
// ============================================================
// <LPDH-ISI> — mengisi template LPDH (format PPK) dengan ExcelJS. JS biasa (tanpa JSX) agar bisa diuji di Node.
const LPDH_KAP = { bb: 40, op: 15, rl: 60, ins: 1, topup: 5 };   // kapasitas baris template (tidak boleh ditambah)
const LPDH_BULAN_ROMAWI = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function lpdhTgl(s) { const p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
function lpdhInfoHari(tgl) {
  const d = lpdhTgl(tgl), dow = (d.getUTCDay() + 6) % 7;   // Senin = 0
  const awal = (new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1)).getUTCDay() + 6) % 7;
  return { mingguKe: Math.floor((d.getUTCDate() - 1 + awal) / 7) + 1, hpeKe: dow <= 4 ? dow + 1 : '', akhirPekan: dow > 4 };
}
function lpdhNomorDefault(tgl, kode) {
  const p = String(tgl).split('-');
  return p[2].padStart(3, '0') + '/LPDH/' + (kode || 'SPPG') + '/' + LPDH_BULAN_ROMAWI[Number(p[1]) - 1] + '/' + p[0];
}
// Bagi total ke 3 komponen sesuai bobot (rupiah bulat; sisa pembulatan ke bobot terbesar). Tanpa bobot → semua ke Bahan Baku.
function lpdhPisah(total, bobot) {
  const sum = bobot.reduce(function(a, b) { return a + b; }, 0);
  if (!(sum > 0)) return [total, 0, 0];
  const r = bobot.map(function(b) { return Math.floor(total * b / sum); });
  let iMax = 0; bobot.forEach(function(b, i) { if (b > bobot[iMax]) iMax = i; });
  r[iMax] += total - r.reduce(function(a, b) { return a + b; }, 0);
  return r;
}
function lpdhKomponen(t) {
  if (t.jenis === 'Bahan Baku') return 'bb';
  if (t.jenis === 'Fasilitas SPPG') return 'ins';
  if (/^gaji\/honor relawan/i.test(String(t.kategori || ''))) return 'rl';
  return 'op';
}
function lpdhWarna(cell) { const f = cell.fill; return f && f.fgColor && f.fgColor.argb ? String(f.fgColor.argb).slice(-6).toUpperCase() : ''; }

// wb: Workbook ExcelJS berisi template asli. data: hasil getDataLPDH. opsi: { nomor, statusHari, hpeKe }
function isiLPDH(wb, data, opsi) {
  opsi = opsi || {};
  // 1. Kosongkan semua isian contoh (sel kuning = SPPG, biru = PPK); rumus tidak disentuh
  wb.eachSheet(function(ws) {
    ws.eachRow({ includeEmpty: false }, function(row) {
      row.eachCell({ includeEmpty: false }, function(cell) {
        const w = lpdhWarna(cell);
        if ((w === 'FFF2CC' || w === 'DDEBF7') && !cell.formula && !cell.sharedFormula) cell.value = null;
      });
    });
  });
  wb.getWorksheet('A_PM').getCell('C19').value = null;   // total porsi diproduksi (contoh, tidak berwarna kuning)

  const id = data.identitas || {};
  const S = function(n) { return wb.getWorksheet(n); };
  const set = function(ws, addr, v) { ws.getCell(addr).value = (v === '' || v === undefined) ? null : v; };
  const info = lpdhInfoHari(data.tanggal);

  // 2. Identitas
  const I = S('Identitas');
  set(I, 'B5', opsi.nomor || lpdhNomorDefault(data.tanggal, data.dapur.kode));
  set(I, 'B6', id.id_sppg); set(I, 'B7', data.dapur.nama);
  set(I, 'B8', id.desa); set(I, 'B9', id.kecamatan); set(I, 'B10', id.kabupaten); set(I, 'B11', id.provinsi);
  set(I, 'B12', id.yayasan); set(I, 'B13', id.no_va); set(I, 'B14', id.bank);
  set(I, 'B15', lpdhTgl(data.tanggal));
  set(I, 'B17', info.mingguKe);
  set(I, 'B18', opsi.statusHari || (info.akhirPekan ? '' : 'HPE'));
  set(I, 'B19', opsi.hpeKe !== undefined && opsi.hpeKe !== '' ? Number(opsi.hpeKe) : info.hpeKe);
  set(I, 'B36', id.pengawas_nama); set(I, 'D36', id.pengawas_nik);
  set(I, 'B37', id.kepala_nama);   set(I, 'D37', id.kepala_nip);
  set(I, 'B38', id.wakil_nama);    set(I, 'D38', id.wakil_nik);

  // 3. Transaksi hari itu per bagian
  const grup = { bb: [], op: [], rl: [], ins: [] };
  (data.transaksi || []).forEach(function(t) { grup[lpdhKomponen(t)].push(t); });
  const kelebihan = [];
  const ambil = function(k) { const a = grup[k].slice(0, LPDH_KAP[k]); grup[k].slice(LPDH_KAP[k]).forEach(function(t) { kelebihan.push({ bagian: k, t: t }); }); return a; };
  const tgl = lpdhTgl(data.tanggal);

  const B = S('B_BahanBaku'), bb = ambil('bb');
  bb.forEach(function(t, i) { const r = 6 + i;
    set(B, 'C' + r, tgl); set(B, 'D' + r, t.uraian); set(B, 'F' + r, 1); set(B, 'G' + r, 'nota'); set(B, 'H' + r, t.riil);
    set(B, 'J' + r, t.pemasok); set(B, 'K' + r, t.no_bukti); set(B, 'L' + r, t.bukti_url); });

  const C = S('C_Operasional'), op = ambil('op');
  op.forEach(function(t, i) { const r = 7 + i;
    set(C, 'C' + r, tgl); set(C, 'D' + r, t.uraian); set(C, 'E' + r, 1); set(C, 'F' + r, 'transaksi'); set(C, 'G' + r, t.riil);
    set(C, 'I' + r, t.no_bukti); set(C, 'J' + r, t.bukti_url); set(C, 'M' + r, t.kategori); });

  const R = S('C1_Relawan'), rl = ambil('rl');
  rl.forEach(function(t, i) { const r = 6 + i;
    set(R, 'C' + r, t.uraian); set(R, 'D' + r, t.kategori); set(R, 'E' + r, tgl); set(R, 'F' + r, 1); set(R, 'G' + r, t.riil);
    set(R, 'I' + r, t.sumber === 'Petty Cash' ? 'Tunai' : 'Transfer'); set(R, 'J' + r, t.no_bukti); set(R, 'K' + r, t.bukti_url); });

  const D = S('D_Insentif'), ins = ambil('ins');
  if (ins[0]) { set(D, 'C21', ins[0].riil); set(D, 'C22', tgl); set(D, 'C23', ins[0].no_bukti); set(D, 'C26', ins[0].bukti_url); }

  // 4. Saldo: saldo awal & top up dibagi ke 3 komponen sesuai porsi pengeluaran hari ini
  const jml = function(a) { return a.reduce(function(s, t) { return s + t.riil; }, 0); };
  const bobot = [jml(bb), jml(op) + jml(rl), jml(ins)];
  const E = S('E_Saldo');
  const awal = lpdhPisah(Math.round(data.saldoAwal || 0), bobot);
  const totB = bobot[0] + bobot[1] + bobot[2];
  ['B5', 'B6', 'B7'].forEach(function(a, i) { set(E, a, awal[i]); });
  ['F5', 'F6', 'F7'].forEach(function(a, i) {
    set(E, a, totB > 0 ? 'Dibagi sesuai porsi pengeluaran hari ini (' + (Math.round(bobot[i] / totB * 1000) / 10) + '%)' : 'Tidak ada pengeluaran: seluruh saldo dicatat di Bahan Baku');
  });
  const tu = (data.topups || []).slice(0, LPDH_KAP.topup);
  (data.topups || []).slice(LPDH_KAP.topup).forEach(function(t) { kelebihan.push({ bagian: 'topup', t: { uraian: t.keterangan, riil: t.jumlah } }); });
  tu.forEach(function(t, i) { const r = 19 + i, b = lpdhPisah(Math.round(t.jumlah), bobot);
    set(E, 'C' + r, lpdhTgl(t.tanggal)); set(E, 'D' + r, t.keterangan || 'Top up VA');
    set(E, 'E' + r, b[0]); set(E, 'F' + r, b[1]); set(E, 'G' + r, b[2]); });

  // 5. Buang hasil hitungan lama (dari data contoh) di semua rumus → Excel/Google Sheets/LibreOffice wajib menghitung ulang
  wb.eachSheet(function(ws) {
    ws.eachRow({ includeEmpty: false }, function(row) {
      row.eachCell({ includeEmpty: false }, function(cell) {
        const v = cell.value;
        if (v && typeof v === 'object' && (v.formula || v.sharedFormula) && 'result' in v) {
          const b = Object.assign({}, v); delete b.result; cell.value = b;
        }
      });
    });
  });
  if (wb.calcProperties) wb.calcProperties.fullCalcOnLoad = true; else wb.calcProperties = { fullCalcOnLoad: true };
  const total = { bb: jml(grup.bb), op: jml(grup.op), rl: jml(grup.rl), ins: jml(grup.ins) };
  return { kelebihan: kelebihan, jumlah: { bb: grup.bb.length, op: grup.op.length, rl: grup.rl.length, ins: grup.ins.length, topup: (data.topups || []).length }, total: total,
    namaFile: ((id.id_sppg || data.dapur.kode || data.dapur.id) + '_' + data.dapur.nama + '_LPDH_' + String(data.tanggal).replace(/-/g, '')).replace(/[\\/:*?"<>|]/g, '-') + '.xlsx' };
}

// ============================================================
//  LPDH — Laporan Penggunaan Dana Harian (format PPK). Tahap 1: isi otomatis dari data yang sudah ada.
// ============================================================
const EXCELJS_URL = 'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js';
const LPDH_TEMPLATE_URL = (location.protocol === 'file:' ? 'https://eyusron98-eng.github.io/mbg-keuangan/' : '') + 'templates/LPDH_SPPG.xlsx?v=4';
const LPDH_STATUS_HARI = ['HPE', 'Libur nasional/cuti bersama', 'Libur sekolah/libur khusus daerah', 'Tanpa pembelajaran tatap muka', 'Kondisi tertentu (pemda/BGN)', 'Melebihi 5 hari dalam seminggu'];
const LPDH_IDENT = [
  ['SPPG', [['id_sppg', 'ID SPPG resmi (BGN)', 'cth. 32.04.XX.XXXX'], ['desa', 'Desa/Kelurahan'], ['kecamatan', 'Kecamatan'], ['kabupaten', 'Kabupaten/Kota', 'Tulis sama persis dengan daftar indeks kemahalan PPK'], ['provinsi', 'Provinsi']]],
  ['Rekening', [['yayasan', 'Nama Mitra/Yayasan'], ['no_va', 'Nomor VA', '', 'numeric'], ['bank', 'Bank Himbara', 'cth. BRI']]],
  ['Penanda tangan', [['pengawas_nama', 'Pengawas Keuangan (Disusun oleh)'], ['pengawas_nik', 'NIK Pengawas Keuangan', '16 digit', 'numeric'],
    ['kepala_nama', 'Kepala SPPG (Mengetahui)'], ['kepala_nip', 'NIP Kepala SPPG', '18 digit', 'numeric'],
    ['wakil_nama', 'Perwakilan Mitra/Yayasan (Menyetujui)'], ['wakil_nik', 'NIK Perwakilan Yayasan', '16 digit', 'numeric']]],
];
const LPDH_BAGIAN = { bb: 'Bahan Baku', op: 'Operasional', rl: 'Honor relawan', ins: 'Insentif Mitra/Yayasan', topup: 'Top up' };

function LpdhPage({ session, scope, toast }) {
  const role = session.user.role;
  const dapurId = (role === 'akuntan' || role === 'pic') ? session.user.dapur : (scope && scope !== 'ALL' ? scope : '');
  const bisaUbah = role !== 'yayasan';
  const [tanggal, setTanggal] = useState(todayISO());
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [opsi, setOpsi] = useState({ statusHari: '', hpeKe: '', nomor: '' });
  const [editIdent, setEditIdent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [hasil, setHasil] = useState(null);

  function load() {
    if (!dapurId) return;
    setLoading(true); setErr(''); setHasil(null);
    api('getDataLPDH', { dapur: dapurId, tanggal: tanggal }).then(function(r) {
      setLoading(false);
      if (!r.ok) { setData(null); setErr(r.error); return; }
      const info = lpdhInfoHari(tanggal);
      setData(r.data);
      setOpsi({ statusHari: info.akhirPekan ? '' : 'HPE', hpeKe: String(info.hpeKe), nomor: lpdhNomorDefault(tanggal, r.data.dapur.kode) });
    });
  }
  useEffect(load, [dapurId, tanggal]);

  if (!dapurId) return <Card><div className="text-sm" style={{ color: COLORS.muted }}>Pilih satu dapur di atas untuk membuat LPDH.</div></Card>;

  const id = (data && data.identitas) || {};
  const kurang = [];
  LPDH_IDENT.forEach(function(g) { g[1].forEach(function(f) { if (!String(id[f[0]] || '').trim()) kurang.push(f[1]); }); });

  // Pratinjau: kelompok, kapasitas, dan nomor bukti kembar hari ini
  const grup = { bb: [], op: [], rl: [], ins: [] };
  const nb = {};
  ((data && data.transaksi) || []).forEach(function(t) { grup[lpdhKomponen(t)].push(t); const k = String(t.no_bukti || '').trim(); nb[k] = (nb[k] || 0) + 1; });
  const kembar = Object.keys(nb).filter(function(k) { return k === '' || k === '-' || nb[k] > 1; });
  const lebih = ['bb', 'op', 'rl', 'ins'].filter(function(k) { return grup[k].length > LPDH_KAP[k]; });
  const sum = function(a) { return a.reduce(function(s, t) { return s + t.riil; }, 0); };

  async function unduh() {
    setBusy(true);
    try {
      if (!window.ExcelJS) await loadScriptOnce(EXCELJS_URL);
      const res = await fetch(LPDH_TEMPLATE_URL);
      if (!res.ok) throw new Error('template LPDH tidak ditemukan');
      const wb = new window.ExcelJS.Workbook();
      await wb.xlsx.load(await res.arrayBuffer());
      const r = isiLPDH(wb, data, opsi);
      const blob = new Blob([await wb.xlsx.writeBuffer()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = r.namaFile;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function() { URL.revokeObjectURL(a.href); }, 5000);
      setHasil(r);
      toast('LPDH diunduh: ' + r.namaFile);
    } catch (e) { toast('Gagal membuat LPDH: ' + e.message, 'error'); }
    setBusy(false);
  }

  const Baris = function(p) { return <div className="flex justify-between gap-3 py-1.5 text-sm" style={{ borderTop: '1px solid ' + COLORS.line }}>
    <span style={{ color: COLORS.muted }}>{p.label}</span><span className="text-right" style={{ color: p.warn ? COLORS.danger : COLORS.ink, fontWeight: 600 }}>{p.children}</span></div>; };

  return (<div className="space-y-4">
    <Card>
      <div className="flex items-start justify-between gap-2 mb-2">
        <div>
          <div className="font-bold" style={{ color: COLORS.ink }}>Identitas LPDH</div>
          <div className="text-xs" style={{ color: COLORS.muted }}>Diisi sekali per dapur · dipakai di setiap LPDH</div>
        </div>
        {bisaUbah && data && <Btn size="sm" kind="ghost" onClick={function() { setEditIdent(true); }}>{I.edit} Ubah</Btn>}
      </div>
      {data && (kurang.length
        ? <div className="text-sm rounded-lg p-3" style={{ background: '#FBF3E2', color: '#7A5408' }}>Belum diisi: {kurang.join(', ')}.</div>
        : <div className="text-sm" style={{ color: COLORS.green }}>{I.check} Lengkap · {id.id_sppg} · {id.yayasan} · {id.pengawas_nama} / {id.kepala_nama} / {id.wakil_nama}</div>)}
    </Card>

    <Card>
      <div className="font-bold mb-3" style={{ color: COLORS.ink }}>Buat LPDH harian</div>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Tanggal pelayanan"><input type="date" value={tanggal} onChange={function(e) { setTanggal(e.target.value); }} style={inputStyle}/></Field>
        <Field label="Status hari">
          <select value={opsi.statusHari} onChange={function(e) { setOpsi(Object.assign({}, opsi, { statusHari: e.target.value })); }} style={inputStyle}>
            <option value="">— pilih —</option>
            {LPDH_STATUS_HARI.map(function(s) { return <option key={s} value={s}>{s}</option>; })}
          </select>
        </Field>
        <Field label="HPE ke- (minggu ini)"><input value={opsi.hpeKe} inputMode="numeric" onChange={function(e) { setOpsi(Object.assign({}, opsi, { hpeKe: e.target.value.replace(/\D/g, '').slice(0, 1) })); }} style={inputStyle}/></Field>
        <Field label="Nomor LPDH"><input value={opsi.nomor} onChange={function(e) { setOpsi(Object.assign({}, opsi, { nomor: e.target.value })); }} style={inputStyle}/></Field>
      </div>
      {loading && <div className="py-3">{I.spinner}</div>}
      {err && <div className="text-sm" style={{ color: COLORS.danger }}>{err}</div>}
      {data && !loading && <>
        <div className="text-xs mb-1" style={{ color: COLORS.muted }}>Periode {data.periode.periode_no} ({data.periode.tanggal_mulai} s.d. {data.periode.tanggal_akhir}) · transaksi bertanggal {tanggal}</div>
        <Baris label="Saldo awal hari ini">{fmt(data.saldoAwal)}</Baris>
        {['bb', 'op', 'rl', 'ins'].map(function(k) { return <Baris key={k} label={LPDH_BAGIAN[k]} warn={grup[k].length > LPDH_KAP[k]}>
          {grup[k].length} transaksi · {fmt(sum(grup[k]))}{grup[k].length > LPDH_KAP[k] ? ' · muat ' + LPDH_KAP[k] : ''}</Baris>; })}
        <Baris label="Top up VA hari ini" warn={data.topups.length > LPDH_KAP.topup}>{data.topups.length} · {fmt(data.topups.reduce(function(s, t) { return s + t.jumlah; }, 0))}</Baris>
        {lebih.length > 0 && <div className="text-sm rounded-lg p-3 mt-3" style={{ background: '#F8E9E5', color: COLORS.danger }}>
          Template PPK hanya muat {lebih.map(function(k) { return LPDH_KAP[k] + ' baris ' + LPDH_BAGIAN[k]; }).join(', ')}. Transaksi sisanya tidak masuk file dan akan didaftar setelah unduh.</div>}
        {kembar.length > 0 && <div className="text-sm rounded-lg p-3 mt-3" style={{ background: '#FBF3E2', color: '#7A5408' }}>
          Nomor bukti kosong/"-"/kembar: {kembar.map(function(k) { return '"' + (k || 'kosong') + '"'; }).join(', ')}. PPK mewajibkan nomor bukti unik — akan ditandai DUPLIKAT di file.</div>}
        <div className="mt-4"><Btn full onClick={unduh} disabled={busy || !data.transaksi.length && !data.topups.length}>{busy ? I.spinner : I.download} Unduh LPDH (.xlsx)</Btn></div>
        {!data.transaksi.length && !data.topups.length && <div className="text-xs mt-2 text-center" style={{ color: COLORS.muted }}>Tidak ada transaksi atau top up pada tanggal ini.</div>}
      </>}
    </Card>

    {hasil && <Card>
      <div className="font-bold mb-2" style={{ color: COLORS.ink }}>Setelah diunduh, lengkapi di Excel</div>
      {hasil.kelebihan.length > 0 && <div className="mb-3">
        <div className="text-sm font-semibold mb-1" style={{ color: COLORS.danger }}>{hasil.kelebihan.length} transaksi tidak muat di template:</div>
        {hasil.kelebihan.map(function(x, i) { return <div key={i} className="text-xs py-1" style={{ borderTop: '1px solid ' + COLORS.line, color: COLORS.ink }}>
          {LPDH_BAGIAN[x.bagian]} · {x.t.no_bukti ? x.t.no_bukti + ' · ' : ''}{x.t.uraian} · {fmt(x.t.riil)}</div>; })}
      </div>}
      <ul className="text-sm list-disc pl-5 space-y-1" style={{ color: COLORS.ink }}>
        <li><b>A_PM</b>: data porsi POP/Fleet, BNBA, nomor & link BAST.</li>
        <li><b>B_BahanBaku</b> kolom Kategori; rincian per bahan (volume, satuan, harga) menyusul di tahap 2.</li>
        <li><b>C1_Relawan</b>: nama per relawan (sementara terisi per transaksi honor).</li>
        <li><b>D_Insentif</b>: syarat insentif (Ya/Tidak), nomor & nilai pernyataan PPK, nomor kuitansi.</li>
        <li><b>E_Saldo</b>: saldo VA menurut mutasi rekening (E10), nomor SP2D & kuitansi top up.</li>
        <li><b>Identitas</b>: tanggal & jam unggah, kolom "Sudah tanda tangan".</li>
      </ul>
      <div className="text-xs mt-2" style={{ color: COLORS.muted }}>Saldo awal & top up dibagi ke 3 komponen sesuai porsi pengeluaran hari ini. Angka memakai nilai riil (uang keluar).</div>
    </Card>}

    {editIdent && <LpdhIdentForm dapurId={dapurId} initial={id} toast={toast} onClose={function() { setEditIdent(false); }} onSaved={load}/>}
  </div>);
}

function LpdhIdentForm({ dapurId, initial, toast, onClose, onSaved }) {
  const [f, setF] = useState(Object.assign({}, initial));
  const [saving, setSaving] = useState(false);
  async function simpan() {
    setSaving(true);
    const r = await apiPost('saveIdentitasLPDH', Object.assign({ dapur: dapurId }, f));
    setSaving(false);
    if (r.ok) { toast('Identitas LPDH disimpan'); onSaved(); onClose(); } else toast(r.error, 'error');
  }
  return <Modal title="Identitas LPDH" onClose={onClose} size="lg">
    {LPDH_IDENT.map(function(g) { return <div key={g[0]}>
      <div className="text-xs font-semibold uppercase mb-2 mt-1" style={{ color: COLORS.muted }}>{g[0]}</div>
      <div className="grid sm:grid-cols-2 gap-x-2">{g[1].map(function(x) { return <Field key={x[0]} label={x[1]} hint={x[2]}>
        <input value={f[x[0]] || ''} inputMode={x[3] || 'text'} onChange={function(e) { const o = {}; o[x[0]] = x[3] === 'numeric' ? e.target.value.replace(/\D/g, '') : e.target.value; setF(Object.assign({}, f, o)); }} style={inputStyle}/>
      </Field>; })}</div>
    </div>; })}
    <div className="flex gap-2"><Btn kind="ghost" onClick={onClose}>Batal</Btn><Btn onClick={simpan} disabled={saving}>{saving ? I.spinner : I.check} Simpan</Btn></div>
  </Modal>;
}

function Laporan({ session, scope, toast }) {
  const [periodeList, setPeriodeList] = useState([]);
  const [selPeriode, setSelPeriode] = useState('');
  const [transaksi, setTransaksi] = useState([]);
  const [vaTopups, setVaTopups] = useState([]);
  const [dapur, setDapur] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(function() {
    Promise.all([
      api('getPeriodeList', { role: session.user.role, dapur: scope, scope: scope }),
      api('getDapur'),
    ]).then(function(arr){
      if (arr[0].ok) {
        setPeriodeList(arr[0].data);
        const aktif = arr[0].data.find(function(p){return p.status === 'AKTIF';});
        if (aktif) setSelPeriode(aktif.id);
        else if (arr[0].data[0]) setSelPeriode(arr[0].data[0].id);
        else setLoading(false);
      } else setLoading(false);
      if (arr[1].ok) setDapur(arr[1].data);
    });
  }, [scope]);

  useEffect(function() {
    if (!selPeriode) return;
    setLoading(true);
    const selObj = periodeList.find(function(p){return p.id === selPeriode;});
    const dapurId = selObj ? selObj.dapur : (scope && scope !== 'ALL' ? scope : (session.user.dapur || ''));
    Promise.all([
      api('getTransaksi', { role: session.user.role, dapur: session.user.dapur || '', scope: scope || 'ALL', periode_id: selPeriode }),
      api('getVATopups', { dapur: dapurId, periode_id: selPeriode }),
    ]).then(function(arr){
      setLoading(false);
      if (arr[0].ok) setTransaksi(arr[0].data);
      if (arr[1].ok) setVaTopups(arr[1].data);
    });
  }, [selPeriode, scope, periodeList]);

  const periode = periodeList.find(function(p){return p.id === selPeriode;});
  const dapurMap = useMemo(function(){ const m = {}; dapur.forEach(function(d){ m[d.id] = d.nama; }); return m; }, [dapur]);
  const dapurNama = periode ? (dapurMap[periode.dapur] || periode.dapur) : (scope && scope !== 'ALL' ? dapurMap[scope] : (session.user.dapur ? dapurMap[session.user.dapur] : 'Semua Dapur'));
  const dapurObj = periode ? dapur.find(function(d){ return d.id === periode.dapur; }) : null;

  const ledger = useMemo(function(){
    if (!periode) return [];
    return buildLedger(periode.saldoVA, periode.saldoPettyAwal, vaTopups, transaksi, 'anggaran');
  }, [periode, vaTopups, transaksi]);

  // Subtotal per jenis (untuk ringkasan)
  const subtotal = useMemo(function() {
    const m = {};
    transaksi.forEach(function(t){
      if (!m[t.jenis]) m[t.jenis] = 0;
      m[t.jenis] += (t.unriil > 0 ? t.unriil : t.riil);
    });
    return m;
  }, [transaksi]);
  const totalAll = Object.values(subtotal).reduce(function(s,v){return s+v;}, 0);

  // Lampiran bukti
  let lampiranNo = 0;
  // Biaya admin memakai bukti yang sama dengan transfer utamanya → tidak dilampirkan dua kali
  const lampiranList = transaksi.map(function(t){
    if (t.bukti_url && !isFeeTx(t)) { lampiranNo++; return { tx: t, no: lampiranNo }; }
    return null;
  }).filter(Boolean);
  const txToLampiranNo = {};
  lampiranList.forEach(function(l){ txToLampiranNo[l.tx.id] = l.no; });
  transaksi.forEach(function(t){
    if (!isFeeTx(t)) return;
    const main = transaksi.find(function(m){ return 'ADMIN:' + m.pengajuan_item_id === t.pengajuan_item_id; });
    if (main && txToLampiranNo[main.id]) txToLampiranNo[t.id] = txToLampiranNo[main.id];
  });

  // Penanda tangan "Dibuat oleh": akuntan dapur pemilik laporan, bukan siapa pun yang sedang login
  const [akuntanDapur, setAkuntanDapur] = useState(null);
  const dapurLaporan = periode ? periode.dapur : '';

    if (!dapurLaporan) return;

    return function(){ live = false; };
  }, [dapurLaporan]);
  // Cadangan bila backend belum diperbarui: pakai nama sendiri hanya kalau yang login memang akuntan dapur ini; selain itu dikosongkan untuk ditulis tangan
  const namaAkuntan = akuntanDapur || (session.user.role === 'akuntan' && session.user.dapur === dapurLaporan ? session.user.nama : '');

  function doPrint() { window.print(); }
  if (loading) return <Card>{I.spinner}</Card>;

                return <option key={p.id} value={p.id}>{(session.user.role === 'admin' || session.user.role === 'yayasan') && dapurMap[p.dapur] ? (dapurMap[p.dapur] + ' · ') : ''}Periode {p.periode_no} · {fmtDateRange(p.tanggal_mulai, p.tanggal_akhir)} · {p.status}</option>;

      <div className="print-container" style={{ background: '#fff', padding: 28, border: '1px solid ' + COLORS.line, borderRadius: 12 }}>

          </div>}
        </div>

        {ledger.length <= 1 ? (

                <tr style={{ background: COLORS.paper, color: COLORS.ink }}>

                  <th style={{ padding: '6px 6px', textAlign: 'left', fontWeight: 700, width: '11%', border: '1px solid ' + COLORS.line }}>No Bukti</th>
                  <th style={{ padding: '6px 6px', textAlign: 'left', fontWeight: 700, border: '1px solid ' + COLORS.line }}>Uraian Transaksi</th>

                  <th style={{ padding: '6px 6px', textAlign: 'right', fontWeight: 700, width: '14%', border: '1px solid ' + COLORS.line }}>Kredit</th>
                  <th style={{ padding: '6px 6px', textAlign: 'right', fontWeight: 700, width: '14%', border: '1px solid ' + COLORS.line }}>Saldo</th>
                </tr>
              </thead>
              <tbody>
                {ledger.map(function(row, idx){
                  const isAwal = row.kind === 'awal';
                  const isTopup = row.kind === 'topup';
                  return <tr key={idx} style={{ background: isAwal ? '#F0F7F2' : (isTopup ? '#F0F4FA' : '#fff') }}>
                    <td style={{ padding: '5px 6px', color: COLORS.ink, border: '1px solid ' + COLORS.line }}>{row.kind === 'awal' ? '-' : fmtDDMMYYYY(row.tanggal)}</td>
                    <td style={{ padding: '5px 6px', color: COLORS.ink, border: '1px solid ' + COLORS.line }}>{row.no_bukti}</td>
                    <td style={{ padding: '5px 6px', color: COLORS.ink, border: '1px solid ' + COLORS.line, fontStyle: isAwal||isTopup ? 'italic' : 'normal' }}>
                      {row.uraian}
                      {row.tx && txToLampiranNo[row.tx.id] && <span style={{ color: COLORS.muted, fontSize: 10 }}> [L-{txToLampiranNo[row.tx.id]}]</span>}
                    </td>
                    <td style={{ padding: '5px 6px', textAlign: 'right', color: row.debit ? COLORS.green : COLORS.muted, border: '1px solid ' + COLORS.line, fontVariantNumeric: 'tabular-nums', fontWeight: row.debit ? 500 : 'normal' }}>
                      {row.debit ? fmtNoRp(row.debit) : '-'}

                    <td style={{ padding: '5px 6px', textAlign: 'right', color: row.kredit ? COLORS.danger : COLORS.muted, border: '1px solid ' + COLORS.line, fontVariantNumeric: 'tabular-nums', fontWeight: row.kredit ? 500 : 'normal' }}>
                      {row.kredit ? fmtNoRp(row.kredit) : '-'}
                    </td>
                    <td style={{ padding: '5px 6px', textAlign: 'right', color: COLORS.ink, border: '1px solid ' + COLORS.line, fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>
                      {fmtNoRp(row.saldo)}

                })}
              </tbody>
            </table>

            {/* RINGKASAN PER JENIS */}
            <div style={{ marginTop: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 12, color: COLORS.ink, marginBottom: 6 }}>Ringkasan Pengeluaran per Jenis</div>
              <table style={{ width: '60%', borderCollapse: 'collapse', fontSize: 11 }}>
                <tbody>
                  {Object.keys(subtotal).sort().map(function(jenis){
                    return <tr key={jenis}>
                      <td style={{ padding: '4px 8px', border: '1px solid ' + COLORS.line, color: COLORS.ink }}>{jenis}</td>
                      <td style={{ padding: '4px 8px', textAlign: 'right', border: '1px solid ' + COLORS.line, color: COLORS.ink, fontVariantNumeric: 'tabular-nums' }}>{fmt(subtotal[jenis])}</td>

                  <tr style={{ background: '#E8F1EC', fontWeight: 700 }}>
                    <td style={{ padding: '4px 8px', border: '1px solid ' + COLORS.line, color: COLORS.ink }}>Saldo Akhir</td>
                    <td style={{ padding: '4px 8px', textAlign: 'right', border: '1px solid ' + COLORS.line, color: COLORS.green, fontVariantNumeric: 'tabular-nums' }}>{fmt(saldoAkhir)}</td>

            </div>

            {/* TANDA TANGAN — 3 kolom */}
            <div style={{ marginTop: 48, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 16, fontSize: 11 }}>
              <div style={{ textAlign: 'center' }}>
                <div style={{ color: COLORS.muted }}>Dibuat oleh,</div>
                <div style={{ marginTop: 60, paddingTop: 4, color: COLORS.ink }}>
                  <div style={{ fontWeight: 700, borderTop: '1px solid ' + COLORS.ink, paddingTop: 4 }}>({namaAkuntan || '.................................'})</div>
                  <div style={{ color: COLORS.muted, fontSize: 10 }}>Akuntan</div>
                </div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <div style={{ color: COLORS.muted }}>Mengetahui,</div>
                <div style={{ marginTop: 60, paddingTop: 4, color: COLORS.ink }}>
                  <div style={{ fontWeight: 700, borderTop: '1px solid ' + COLORS.ink, paddingTop: 4 }}>(.................................)</div>
                  <div style={{ color: COLORS.muted, fontSize: 10 }}>Perwakilan Yayasan</div>
                </div>
              </div>
              <div style={{ textAlign: 'center' }}>
                <div style={{ color: COLORS.muted }}>Mengetahui,</div>
                <div style={{ marginTop: 60, paddingTop: 4, color: COLORS.ink }}>
                  <div style={{ fontWeight: 700, borderTop: '1px solid ' + COLORS.ink, paddingTop: 4 }}>(.................................)</div>
                  <div style={{ color: COLORS.muted, fontSize: 10 }}>Kepala Dapur {dapurNama}</div>
                </div>
              </div>
            </div>
          </>
        )}

        {/* LAMPIRAN BUKTI */}
        {lampiranList.length > 0 && (
          <div style={{ marginTop: 40, pageBreakBefore: 'always' }} className="page-break">
            <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink, marginBottom: 12, borderBottom: '2px solid ' + COLORS.ink, paddingBottom: 6, textAlign: 'center' }}>
              LAMPIRAN BUKTI TRANSAKSI
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 12 }}>
              {lampiranList.map(function(l){
                return <div key={l.no} style={{ border: '1px solid ' + COLORS.line, borderRadius: 6, padding: 10, pageBreakInside: 'avoid' }}>
                  <div style={{ fontSize: 10, marginBottom: 4, color: COLORS.muted }}>
                    <b style={{ color: COLORS.ink }}>L-{l.no}</b> · {fmtDate(l.tx.tanggal)} · {l.tx.no_bukti || '(tanpa no bukti)'} · {l.tx.uraian} · {fmt(l.tx.unriil > 0 ? l.tx.unriil : l.tx.riil)}
                  </div>
                  <div style={{ textAlign: 'center' }}>
                    <img src={driveThumb(l.tx.bukti_url)} alt={'Bukti ' + l.no} className="lampiran-img"
                      style={{ maxWidth: '100%', maxHeight: 360, objectFit: 'contain', border: '1px solid ' + COLORS.line, borderRadius: 4 }}
                      onError={function(e){ e.target.style.display = 'none'; e.target.nextSibling && (e.target.nextSibling.style.display = 'block'); }}/>
                    <div style={{ display: 'none', padding: 16, color: COLORS.muted, fontSize: 11 }}>
                      [Bukti tidak dapat ditampilkan — link: <a href={l.tx.bukti_url} target="_blank" rel="noopener">{l.tx.bukti_url}</a>]
                    </div>
