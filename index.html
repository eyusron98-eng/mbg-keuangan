<!DOCTYPE html>
<!-- FILE HASIL BUILD — jangan diedit langsung. Ubah src/index.html lalu jalankan: npm run build -->
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Keuangan MBG — Koperasi ISS</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<style>
  body { font-family: "Inter", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F4F2EC; margin: 0; color: #172A1F; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }

  /* Kenyamanan: fokus jelas, sentuhan responsif, animasi halus */
  input, select, textarea { transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease; }
  input:focus, select:focus, textarea:focus { border-color: #15663E !important; box-shadow: 0 0 0 3px rgba(21,102,62,0.14); }
  button:focus-visible, a:focus-visible { outline: 2px solid #15663E; outline-offset: 2px; }
  button { transition: transform .08s ease, opacity .15s ease, background-color .15s ease, box-shadow .15s ease, border-color .15s ease; }
  button:not(:disabled):hover { filter: brightness(0.99); }
  button:not(:disabled):active { transform: scale(0.975); }
  button:disabled { cursor: not-allowed; }
  .mbg-card { background: #FFFFFF; border: 1px solid rgba(23,42,31,0.09); box-shadow: 0 2px 6px rgba(23,42,31,0.03), 0 12px 28px -12px rgba(23,42,31,0.05); }
  .mbg-hero { background: linear-gradient(135deg, #0E4429 0%, #15663E 58%, #1E7E4E 100%); color: #FFFFFF; box-shadow: 0 10px 26px -10px rgba(14,68,41,0.45); }
  .mbg-step { position: relative; border-radius: 14px; padding: 10px 12px; text-align: left; border: 1px solid #E3E0D6; background: #FAF9F5; }
  .mbg-step[data-active="true"] { background: #15663E; color: #FFFFFF; border-color: #15663E; box-shadow: 0 6px 16px -6px rgba(21,102,62,0.45); }
  .mbg-step[data-done="true"]:not([data-active="true"]) { background: #EAF4EE; color: #0E4429; border-color: #B9D7C6; }
  /* PENTING: jangan animasikan transform pada pembungkus halaman. Di Chrome, elemen dengan animasi transform
     (apalagi fill-mode both) menjadi containing block bagi position:fixed, sehingga modal/overlay ikut kotak halaman
     (modal muncul jauh di bawah atau terpotong di atas layar). Halaman cukup memudar (opacity). */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  main > div { animation: fadeIn .2s ease; }
  .sheet { animation: sheetUp .2s ease; }   /* tanpa fill-mode: setelah selesai tidak ada transform yang tertinggal (modal bertumpuk tetap benar) */
  @media (pointer: coarse) { button { min-height: 40px; } }
  /* main tidak boleh jadi scroll-container, kalau tidak position:sticky di dalamnya tidak berfungsi */
  .app-main { min-width: 0; overflow-x: hidden; }
  @supports (overflow: clip) { .app-main { overflow-x: clip; } }
  /* Bar aksi yang selalu terlihat di bawah layar (di atas navigasi bawah pada HP) */
  .sticky-bar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); z-index: 20; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px);
    margin: 14px -16px -16px; padding: 12px 16px; border-top: 1px solid #E3E0D6; border-radius: 0 0 16px 16px; box-shadow: 0 -8px 18px rgba(23,42,31,0.07); }
  @media (min-width: 640px) { .sticky-bar { margin: 14px -20px -20px; padding: 12px 20px; } }
  @media (min-width: 768px) { .sticky-bar { bottom: 0; } }
  /* iOS: setelah keyboard ditutup (atau toolbar browser berubah) area layar yang terlihat kadang tertinggal bergeser dari
     viewport tata letak → navigasi bawah "naik" ke tengah & header hilang ke atas. Skrip vvKoreksi mengukur selisihnya
     dan memasang kelas vv-geser + variabel --vv-atas/--vv-bawah; tanpa kelas itu aturan di bawah tidak berlaku. */
  .vv-geser header.vv-atas { top: var(--vv-atas, 0px) !important; }
  .vv-geser .vv-bawah { bottom: calc(0px - var(--vv-bawah, 0px)) !important; }
  .vv-geser .vv-layar { top: var(--vv-atas, 0px) !important; bottom: calc(0px - var(--vv-bawah, 0px)) !important; }
  .vv-geser .vv-toast { margin-top: var(--vv-atas, 0px); }
  .vv-geser .sticky-bar { bottom: calc(env(safe-area-inset-bottom, 0px) + 66px - var(--vv-bawah, 0px)); }
  @media (min-width: 768px) { .vv-geser .sticky-bar { bottom: calc(0px - var(--vv-bawah, 0px)); } }
  /* 16px mencegah iOS memperbesar layar sendiri saat mengetik */
  @media (max-width: 640px) {
    input:not([type=checkbox]):not([type=file]), select, textarea { font-size: 16px !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  #loading-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #F4F2EC; z-index: 9999; flex-direction: column; gap: 16px; }
  #loading-screen .sp { width: 36px; height: 36px; border: 3px solid #E3E0D6; border-top-color: #15663E; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error-banner { position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px; background: #B7472E; color: white; font-size: 13px; z-index: 10000; display: none; white-space: pre-wrap; line-height: 1.5; font-family: ui-monospace, monospace; }

  @media print {
    body { background: white; }
    .no-print { display: none !important; }
    .print-container { padding: 0 !important; box-shadow: none !important; border: none !important; }
    @page { size: A4; margin: 1.5cm 1.2cm; }
    table { page-break-inside: avoid; }
    .page-break { page-break-after: always; }
    .lampiran-img { max-width: 100%; max-height: 18cm; page-break-inside: avoid; }
  }
</style>
